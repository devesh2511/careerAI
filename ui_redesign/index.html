<!doctype html>
<html lang="en" data-theme="light">
<head>
  <script>(function(){var t;try{t=localStorage.getItem('careerai_theme')}catch(e){}document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light')})()</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crackeer redesign prototype</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layouts.css">
  <style>
    body { overflow: hidden; }
    .gal { display: grid; grid-template-columns: 260px minmax(0, 1fr); height: 100vh; height: 100dvh; }
    .gal-side { border-right: var(--outline); background: var(--surface); overflow-y: auto; padding: var(--sp-5) var(--sp-3); display: grid; gap: var(--sp-1); align-content: start; }
    .gal-side .logo { padding: 0 10px var(--sp-1); }
    .gal-side .muted { padding: 0 10px var(--sp-2); font-size: var(--fs-small); }
    .gal-item { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2); width: 100%; text-align: left; }
    .gal-pass { font-size: 0.6875rem; font-weight: 600; color: var(--muted); }
    .nav-item.active .gal-pass { color: var(--paper); }
    .gal-main { display: grid; grid-template-rows: auto minmax(0, 1fr); min-width: 0; }
    .gal-bar { display: flex; flex-wrap: wrap; gap: var(--sp-3); align-items: center; padding: var(--sp-3) var(--sp-5); border-bottom: var(--outline-soft); background: var(--paper); }
    .gal-bar .select-wrap { min-width: 200px; }
    .gal-bar .select { min-height: 36px; padding-block: 6px; font-size: var(--fs-small); }
    .gal-check { display: inline-flex; gap: 6px; align-items: center; font-size: var(--fs-small); font-weight: 600; }
    .gal-stage { overflow: auto; background: var(--sunk); padding: var(--sp-5); display: flex; justify-content: center; align-items: flex-start; }
    .gal-frame { background: var(--paper); border: var(--outline); border-radius: var(--r-card); box-shadow: var(--shadow-hard); height: 100%; min-height: 560px; max-width: none; flex: 0 0 auto; }
    .gal-size { font-size: var(--fs-small); color: var(--muted); }
    .gal-pick { display: none; }
    @media (max-width: 900px) {
      .gal { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
      .gal-side { display: none; }
      .gal-pick { display: block; }
    }
  </style>
</head>
<body>
  <div class="gal">
    <aside class="gal-side" aria-label="Screens">
      <span class="logo">Crackeer<span class="logo-dot">.</span></span>
      <p class="muted">Redesign prototype</p>
      <nav id="gal-list" class="stack-xs stack"></nav>
    </aside>
    <div class="gal-main">
      <div class="gal-bar">
        <div class="select-wrap gal-pick"><select class="select" id="gal-screen" aria-label="Screen"></select><svg class="icon" aria-hidden="true"><use href="assets/icons/sprite.svg#i-chevron-down"/></svg></div>
        <div class="seg" id="gal-widths" role="group" aria-label="Width"></div>
        <div class="seg" role="group" aria-label="Theme">
          <button class="seg-btn" type="button" data-theme-set="light">Light</button>
          <button class="seg-btn" type="button" data-theme-set="dark">Dark</button>
        </div>
        <div class="select-wrap"><select class="select" id="gal-state" aria-label="State"></select><svg class="icon" aria-hidden="true"><use href="assets/icons/sprite.svg#i-chevron-down"/></svg></div>
        <label class="gal-check"><input type="checkbox" id="gal-stress"> Long text</label>
        <a class="btn btn-ghost btn-sm" id="gal-open" href="#" target="_blank" rel="noopener"><svg class="icon" aria-hidden="true"><use href="assets/icons/sprite.svg#i-external-link"/></svg>Open in new tab</a>
        <span class="gal-size" id="gal-size"></span>
      </div>
      <div class="gal-stage"><iframe class="gal-frame" id="gal-frame" title="Screen preview"></iframe></div>
    </div>
  </div>
  <script>
  (function () {
    var WIDTHS = [320, 360, 390, 768, 1024, 1280, 1440, 'Fit'];
    var KEY = 'proto_gallery';
    var saved = {};
    try { saved = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}
    var st = { screen: saved.screen, width: saved.width || 390, theme: document.documentElement.getAttribute('data-theme'), state: saved.state, stress: !!saved.stress };
    var screens = [];
    var frame = document.getElementById('gal-frame');
    var list = document.getElementById('gal-list');
    var pick = document.getElementById('gal-screen');
    var stateSel = document.getElementById('gal-state');

    function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
    function cur() { return screens.filter(function (s) { return s.id === st.screen; })[0] || screens[0]; }
    function url() {
      var s = cur();
      return s.file + '?state=' + encodeURIComponent(st.state || '') + '&theme=' + st.theme + (st.stress ? '&stress=1' : '');
    }
    function applyWidth() {
      frame.style.width = st.width === 'Fit' ? '100%' : st.width + 'px';
      document.getElementById('gal-size').textContent = st.width === 'Fit' ? 'Fit to window' : st.width + 'px wide';
      document.querySelectorAll('#gal-widths .seg-btn').forEach(function (b) { b.classList.toggle('active', String(b.dataset.w) === String(st.width)); });
    }
    function renderStates() {
      var s = cur();
      stateSel.innerHTML = '';
      s.states.forEach(function (name) { var o = document.createElement('option'); o.value = name; o.textContent = name; stateSel.appendChild(o); });
      if (s.states.indexOf(st.state) < 0) st.state = s.states[0];
      stateSel.value = st.state;
    }
    function relabelStates() {
      try {
        var labels = frame.contentWindow.Proto.states();
        labels.forEach(function (l) { var o = stateSel.querySelector('option[value="' + l.name + '"]'); if (o) o.textContent = l.label; });
      } catch (e) {}
    }
    function load() {
      renderStates();
      frame.src = url();
      document.getElementById('gal-open').href = url();
      list.querySelectorAll('.nav-item').forEach(function (b) { b.classList.toggle('active', b.dataset.id === st.screen); });
      pick.value = st.screen;
      save();
    }
    function post(msg) {
      try { frame.contentWindow.postMessage(Object.assign({ type: 'proto' }, msg), '*'); } catch (e) {}
      document.getElementById('gal-open').href = url();
      save();
    }
    function setTheme(t) {
      st.theme = t;
      document.documentElement.setAttribute('data-theme', t);
      try { localStorage.setItem('careerai_theme', t); } catch (e) {}
      document.querySelectorAll('[data-theme-set]').forEach(function (b) { b.classList.toggle('active', b.dataset.themeSet === t); });
      post({ theme: t });
    }

    frame.addEventListener('load', relabelStates);
    WIDTHS.forEach(function (w) {
      var b = document.createElement('button');
      b.className = 'seg-btn'; b.type = 'button'; b.dataset.w = w; b.textContent = w;
      b.addEventListener('click', function () { st.width = w; applyWidth(); save(); });
      document.getElementById('gal-widths').appendChild(b);
    });
    document.querySelectorAll('[data-theme-set]').forEach(function (b) { b.addEventListener('click', function () { setTheme(b.dataset.themeSet); }); });
    stateSel.addEventListener('change', function () { st.state = stateSel.value; post({ state: st.state }); });
    pick.addEventListener('change', function () { st.screen = pick.value; st.state = null; load(); });
    var stress = document.getElementById('gal-stress');
    stress.checked = st.stress;
    stress.addEventListener('change', function () { st.stress = stress.checked; load(); });

    fetch('screens.json').then(function (r) { return r.json(); }).then(function (data) {
      var ORDER = ['Foundations', 'Public', 'Step flows', 'App', 'Chat'];
      screens = data.slice().sort(function (a, b) { return ORDER.indexOf(a.group) - ORDER.indexOf(b.group); });
      data = screens;
      var group = null;
      data.forEach(function (s) {
        if (s.group !== group) {
          group = s.group;
          var g = document.createElement('p'); g.className = 'nav-group'; g.textContent = group; list.appendChild(g);
        }
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'nav-item gal-item'; b.dataset.id = s.id;
        b.innerHTML = '<span class="grow"></span><span class="gal-pass">Pass ' + s.pass + '</span>';
        b.firstChild.textContent = s.title;
        b.addEventListener('click', function () { st.screen = s.id; st.state = null; load(); });
        list.appendChild(b);
        var o = document.createElement('option'); o.value = s.id; o.textContent = s.group + ': ' + s.title; pick.appendChild(o);
      });
      if (!cur() || !st.screen) st.screen = screens[0].id;
      applyWidth();
      setTheme(st.theme);
      load();
    });
  })();
  </script>
</body>
</html>
