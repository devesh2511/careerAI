          <div class="stack-xs stack"><h2 class="card-title" id="pw-school-title">Is your school on Crackeer?</h2><p class="card-sub">If your school has a Crackeer plan, enter the School ID they gave you and you're in for free.</p></div>

            <label class="visually-hidden" for="pw-code">School ID</label>

            <button class="btn btn-secondary" id="pw-code-btn" type="submit">Check</button>
          </form>
          <p class="form-error" id="pw-code-error" hidden><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-circle-alert"/></svg>We couldn't find that School ID. Check it with your school.</p>
        </section>
        <div class="pw-or"><span>or get your own plan</span></div>
        <div class="grid-2">
          <div class="card-flat pw-plan stack-sm stack"><p class="card-title">Monthly</p><p><span class="pw-price num">&#8377;199</span> <span class="muted">a month</span></p><p class="card-sub">Try it for a month. Stop any time.</p></div>
          <div class="card pw-plan stack-sm stack"><div class="cluster cluster-between"><p class="card-title">Annual</p><span class="badge fit-strong">Best value</span></div><p><span class="pw-price num">&#8377;1,499</span> <span class="muted">a year</span></p><p class="card-sub">Works out to &#8377;125 a month, 37% less than monthly.</p></div>
        </div>
        <div class="card-sunk stack-sm stack">
          <p class="list-title">Every plan includes</p>
          <ul class="pw-includes">
            <li><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-check"/></svg>Career matches and your full report</li>
            <li><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-check"/></svg>A roadmap for every career</li>
            <li><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-check"/></svg>AI Chat that knows your results</li>
            <li><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-check"/></svg>Weekly contests and leaderboards</li>
            <li><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-check"/></svg>Career Space news, internships and jobs</li>
          </ul>
        </div>
        <section class="stack-sm stack" aria-labelledby="pw-pay-title">
          <h2 class="card-title" id="pw-pay-title">How to pay</h2>
          <ol class="timeline">
            <li class="tl-item"><span class="tl-dot">1</span><p class="tl-title">Pay for the plan you want</p><p class="tl-meta">Contact the Crackeer team for payment details. UPI and bank transfer both work.</p></li>
            <li class="tl-item"><span class="tl-dot">2</span><p class="tl-title">Send us your payment ID</p><p class="tl-meta">The UPI reference or UTR, plus the email you registered with: aarav.m@gmail.com.</p></li>
            <li class="tl-item"><span class="tl-dot">3</span><p class="tl-title">We switch your plan on</p><p class="tl-meta">Once the payment is confirmed, press Check again.</p></li>
          </ol>
          <div><button class="btn btn-primary" type="button">Check again</button></div>
          <p class="small muted">Your plan runs from the day it's switched on.</p>
        </section>
    </div>
  </template>
