<!doctype html>
<html lang="en" data-theme="light">
<head>
  <script>(function(){var t=new URLSearchParams(location.search).get('theme');try{t=t||localStorage.getItem('careerai_theme')}catch(e){}document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light')})()</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tell us about you · Crackeer</title>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/layouts.css">

</head>
<body data-page="onboarding" data-screen="onboarding">
  <div class="flow" data-proto-root></div>

  <template data-state="step-1" data-label="Step 1: About you">
    <header class="flow-bar">
      <span aria-hidden="true"></span>
      <p class="flow-title" id="ob-count">Step 1 of 4</p>
      <span aria-hidden="true"></span>
      <progress class="progress" id="ob-bar" max="4" value="1">1 of 4</progress>
    </header>
    <main class="flow-main" id="onboarding">
      <ol class="ob-steps" id="ob-dots" aria-label="Steps"><li class="dot active" aria-current="step"><span class="dot-mark">1</span><span class="dot-label">About you</span></li><li class="dot "><span class="dot-mark">2</span><span class="dot-label">Marks</span></li><li class="dot "><span class="dot-mark">3</span><span class="dot-label">Interests</span></li><li class="dot "><span class="dot-mark">4</span><span class="dot-label">Preferences</span></li></ol>
      <div class="stack-sm stack"><h1 id="ob-title">About you</h1><p class="muted" id="ob-sub">So we can match careers to your board, medium and city.</p></div>
      <div class="alert alert-error" id="ob-error" role="alert" hidden><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-circle-alert"/></svg><span>Marks must be between 0 and 100. Check Science.</span></div>
      <section class="stack-lg stack" id="ob-step-1"><div class="grid-2"><div class="field"><label class="field-label" for="ob-class">Current class</label><div class="select-wrap"><select class="select" id="ob-class"><option>Class 9</option><option selected>Class 10</option></select><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-chevron-down"/></svg></div></div><div class="field"><label class="field-label" for="ob-board">School board</label><div class="select-wrap"><select class="select" id="ob-board"><option selected>CBSE</option><option>ICSE</option><option>State Board</option></select><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-chevron-down"/></svg></div></div><div class="field"><label class="field-label" for="ob-medium">Medium of instruction</label><div class="select-wrap"><select class="select" id="ob-medium"><option selected>English</option><option>Hindi</option><option>Regional language</option></select><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-chevron-down"/></svg></div></div><div class="field"><label class="field-label" for="ob-city">City</label><input class="input" id="ob-city" type="text" value="Pune" placeholder="e.g. Mumbai, Delhi, Bengaluru" autocomplete="address-level2" aria-describedby="ob-city-error"><p class="form-error" id="ob-city-error" hidden><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-circle-alert"/></svg></p></div></div></section>
    </main>
    <footer class="flow-foot"><div class="flow-foot-inner">
      <button class="btn btn-secondary" id="ob-back" type="button" disabled><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-arrow-left"/></svg>Back</button>
      <button class="btn btn-primary" id="ob-next" type="button">Next<svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-arrow-right"/></svg></button>
    </div></footer>
  </template>

  <template data-state="step-2" data-label="Step 2: Your recent marks">

      <span aria-hidden="true"></span>
      <p class="flow-title" id="ob-count">Step 2 of 4</p>
      <span aria-hidden="true"></span>
      <progress class="progress" id="ob-bar" max="4" value="2">2 of 4</progress>
    </header>
    <main class="flow-main" id="onboarding">

      <div class="stack-sm stack"><h1 id="ob-title">Your recent marks</h1><p class="muted" id="ob-sub">Optional. Percentages from your last exam help us suggest a stream. Skip any you don't know.</p></div>
      <div class="alert alert-error" id="ob-error" role="alert" hidden><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-circle-alert"/></svg><span>Marks must be between 0 and 100. Check Science.</span></div>

    </main>
    <footer class="flow-foot"><div class="flow-foot-inner">
      <button class="btn btn-secondary" id="ob-back" type="button"><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-arrow-left"/></svg>Back</button>
      <button class="btn btn-primary" id="ob-next" type="button">Next<svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-arrow-right"/></svg></button>
    </div></footer>
  </template>

      <section class="stack-lg stack" id="ob-step-3"><div class="field"><span class="field-label" id="ob-subjects-label">Favourite subjects</span><p class="field-hint">Pick all you like.</p><div class="chip-group" id="ob-subjects" role="group" aria-labelledby="ob-subjects-label" data-proto-select="multi"><button class="chip selected" type="button" aria-pressed="true">Mathematics</button><button class="chip selected" type="button" aria-pressed="true">Science</button><button class="chip selected" type="button" aria-pressed="true">Computer</button><button class="chip" type="button" aria-pressed="false">English</button><button class="chip" type="button" aria-pressed="false">Art and Design</button><button class="chip" type="button" aria-pressed="false">Social Studies</button><button class="chip" type="button" aria-pressed="false">Economics</button><button class="chip" type="button" aria-pressed="false">Music</button></div></div><div class="field"><span class="field-label" id="ob-hobbies-label">Hobbies and interests</span><div class="chip-group" id="ob-hobbies" role="group" aria-labelledby="ob-hobbies-label" data-proto-select="multi"><button class="chip" type="button" aria-pressed="false">Drawing and design</button><button class="chip selected" type="button" aria-pressed="true">Coding</button><button class="chip" type="button" aria-pressed="false">Sports</button><button class="chip" type="button" aria-pressed="false">Music</button><button class="chip" type="button" aria-pressed="false">Reading</button><button class="chip selected" type="button" aria-pressed="true">Gaming</button><button class="chip" type="button" aria-pressed="false">Debating</button><button class="chip" type="button" aria-pressed="false">Cooking</button></div></div><div class="field"><label class="field-label" for="ob-dream">Dream job or role model <span class="optional">(optional)</span></label><input class="input" id="ob-dream" type="text" placeholder="e.g. I want to design apps like Instagram" aria-de     </main>
    <footer class="flow-foot"><div class="flow-foot-inner">
      <button class="btn btn-secondary" id="ob-back" type="button"><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-arrow-left"/></svg>Back</button>
      <button class="btn btn-primary" id="ob-next" type="button">Next<svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-arrow-right"/></svg></button>
    </div></footer>
  </template>

    <footer class="flow-foot"><div class="flow-foot-inner">
      <button class="btn btn-secondary" id="ob-back" type="button"><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-arrow-left"/></svg>Back</button>

    </header>
    <main class="flow-main" id="onboarding">
      <ol class="ob-steps" id="ob-dots" aria-label="Steps"><li class="dot done"><span class="dot-mark"><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-check"/></svg></span><span class="dot-label">About you</span></li><li class="dot active" aria-current="step"><span class="dot-mark">2</span><span class="dot-label">Marks</span></li><li class="dot "><span class="dot-mark">3</span><span class="dot-label">Interests</span></li><li class="dot "><span class="dot-mark">4</span><span class="dot-label">Preferences</span></li></ol>
