<!doctype html>
<html lang="en" data-theme="light">
<head>
  <script>(function(){var t=new URLSearchParams(location.search).get('theme');try{t=t||localStorage.getItem('careerai_theme')}catch(e){}document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light')})()</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Foundations · Crackeer prototype</title>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/layouts.css">
  <script src="../js/proto.js" defer></script>
  <style>
    /* Board-only helpers. */
    .fb { max-width: 1120px; margin: 0 auto; padding: var(--sp-8) var(--sp-4) var(--sp-10); }
    .fb-section { display: grid; gap: var(--sp-4); padding-block: var(--sp-8); border-top: var(--outline-soft); }
    .fb-section:first-of-type { border-top: 0; }
    .fb-swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: var(--sp-3); }
    .fb-sw { display: grid; gap: 6px; font-size: var(--fs-small); }
    .fb-sw i { display: block; height: 56px; border-radius: var(--r-card); border: var(--outline); background: var(--c-sw); }
    .fb-sw code { color: var(--muted); font-size: 0.75rem; }
    .sw-paper { --c-sw: var(--paper); } .sw-surface { --c-sw: var(--surface); } .sw-sunk { --c-sw: var(--sunk); }
    .sw-ink { --c-sw: var(--ink); } .sw-muted { --c-sw: var(--muted); } .sw-accent { --c-sw: var(--accent); }
    .sw-accent-weak { --c-sw: var(--accent-weak); } .sw-hl { --c-sw: var(--hl); } .sw-ok { --c-sw: var(--ok); }
    .sw-warn { --c-sw: var(--warn); } .sw-bad { --c-sw: var(--bad); }
    .fb-sw[data-dim] i { --c-sw: var(--dim); }
    .fb-type { display: grid; gap: var(--sp-3); }
    .fb-icons { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: var(--sp-2); }
    .fb-icons figure { margin: 0; display: grid; justify-items: center; gap: 6px; padding: var(--sp-3) var(--sp-1); border: var(--outline-soft); border-radius: var(--r-card); font-size: 0.6875rem; color: var(--muted); text-align: center; overflow-wrap: anywhere; }
    .fb-icons .icon { width: 24px; height: 24px; color: var(--ink); }
    .fb-illos { display: flex; flex-wrap: wrap; gap: var(--sp-6); align-items: center; padding: var(--sp-2); }
    .fb-demo-sheet { position: relative; transform: none; visibility: visible; max-height: none; z-index: auto; border: var(--outline); border-radius: var(--r-nav); }
    .fb-demo-drawer { position: relative; transform: none; visibility: visible; width: 100%; max-width: 380px; z-index: auto; border: var(--outline); border-radius: var(--r-card); height: auto; }
  </style>
</head>
<body data-page="foundations" data-screen="foundations">
  <main data-proto-root></main>

  <template data-state="board" data-label="Component board">
    <div class="fb">
      <header class="stack-sm stack">
        <p class="muted">Crackeer design system</p>
        <h1>Foundations, <span class="hl">one page</span> at a time.</h1>
        <p class="muted">Every screen in the prototype is built only from what is on this board. Switch the theme in the gallery to check the night notebook.</p>
      </header>

      <section class="fb-section" aria-labelledby="fb-colour">
        <h2 id="fb-colour">Colour</h2>
        <div class="fb-swatches">
          <div class="fb-sw sw-paper"><i></i>Paper<code>--paper</code></div>
          <div class="fb-sw sw-surface"><i></i>Surface<code>--surface</code></div>
          <div class="fb-sw sw-sunk"><i></i>Sunk<code>--sunk</code></div>
          <div class="fb-sw sw-ink"><i></i>Ink<code>--ink</code></div>
          <div class="fb-sw sw-muted"><i></i>Muted<code>--muted</code></div>
          <div class="fb-sw sw-accent"><i></i>Coral<code>--accent</code></div>
          <div class="fb-sw sw-accent-weak"><i></i>Coral wash<code>--accent-weak</code></div>
          <div class="fb-sw sw-hl"><i></i>Highlighter<code>--hl</code></div>
          <div class="fb-sw sw-ok"><i></i>Strong fit<code>--ok</code></div>
          <div class="fb-sw sw-warn"><i></i>Good fit<code>--warn</code></div>
          <div class="fb-sw sw-bad"><i></i>Error<code>--bad</code></div>
        </div>
        <h3>Interest areas (RIASEC)</h3>
        <div class="fb-swatches">
          <div class="fb-sw" data-dim="R"><i></i>R, Doer</div>
          <div class="fb-sw" data-dim="I"><i></i>I, Thinker</div>
          <div class="fb-sw" data-dim="A"><i></i>A, Creator</div>
          <div class="fb-sw" data-dim="S"><i></i>S, Helper</div>
          <div class="fb-sw" data-dim="E"><i></i>E, Leader</div>
          <div class="fb-sw" data-dim="C"><i></i>C, Organiser</div>
        </div>
      </section>

      <section class="fb-section" aria-labelledby="fb-type">
        <h2 id="fb-type">Type</h2>
        <div class="fb-type">
          <h1>Your <span class="hl">path</span> is taking shape.</h1>
          <h2>Section heading in Fraunces</h2>
          <h3>Card title in Fraunces</h3>
          <p>Body text is Inter at 15 to 16 pixels with relaxed leading, so long reads like career details and roadmaps stay comfortable on a phone.</p>
          <p class="small muted">Small and meta text, 13 pixels.</p>
          <p class="cluster"><span class="num">02:14:37</span><span class="num">#14</span><span class="num">86%</span><span class="small muted">Numbers use Space Grotesk.</span></p>
        </div>
      </section>

      <section class="fb-section" aria-labelledby="fb-buttons">
        <h2 id="fb-buttons">Buttons</h2>
        <div class="cluster cluster-lg">
          <button class="btn btn-primary" type="button">Start the quiz</button>
          <button class="btn btn-secondary" type="button"><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-download"/></svg>Save as PDF</button>
          <button class="btn btn-ghost" type="button">Retake quiz</button>
          <button class="btn btn-danger" type="button">Remove school</button>
          <button class="btn btn-primary busy" type="button">Saving</button>
          <button class="btn btn-secondary" type="button" disabled>Disabled</button>
          <button class="btn btn-secondary btn-sm" type="button">Small</button>
          <button class="btn btn-icon" type="button" aria-label="Search"><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-search"/></svg></button>
        </div>
      </section>

      <section class="fb-section" aria-labelledby="fb-forms">
        <h2 id="fb-forms">Forms</h2>
        <div class="grid-2">
          <div class="field">
            <label class="field-label" for="fb-email">Email</label>
            <input class="input" id="fb-email" type="email" placeholder="you@school.in" autocomplete="off">
            <p class="field-hint">Use the email you registered with.</p>
          </div>
          <div class="field">
            <label class="field-label" for="fb-pass">Password</label>
            <div class="password-field">
              <input class="input" id="fb-pass" type="password" value="notebook">
              <button class="password-toggle" type="button" aria-label="Show password"><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-eye"/></svg></button>
            </div>
          </div>
          <div class="field">
            <label class="field-label" for="fb-bad">Confirm password</label>
            <input class="input is-invalid" id="fb-bad" type="password" value="notebok" aria-invalid="true" aria-describedby="fb-bad-error">
            <p class="form-error" id="fb-bad-error"><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-circle-alert"/></svg>Passwords don't match yet.</p>
          </div>
          <div class="field">
            <label class="field-label" for="fb-board">Board <span class="optional">(optional)</span></label>
            <div class="select-wrap">
              <select class="select" id="fb-board"><option>CBSE</option><option>ICSE</option><option>State board</option></select>
              <svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-chevron-down"/></svg>
            </div>
          </div>
        </div>
        <div class="field">
          <span class="field-label">Subjects you enjoy</span>
          <div class="chip-group" data-proto-select="multi" data-max="3">
            <button class="chip selected" type="button" aria-pressed="true">Maths</button>
            <button class="chip selected" type="button" aria-pressed="true">Physics</button>
            <button class="chip" type="button" aria-pressed="false">Computer science</button>
            <button class="chip" type="button" aria-pressed="false">Biology</button>
            <button class="chip" type="button" aria-pressed="false">Fine arts</button>
          </div>
        </div>
      </section>

      <section class="fb-section" aria-labelledby="fb-nav">
        <h2 id="fb-nav">Tabs and segments</h2>
        <div class="tabs" role="tablist" data-proto-tabs>
          <button class="tab-btn active" role="tab" aria-selected="true" type="button">Global</button>
          <button class="tab-btn" role="tab" aria-selected="false" type="button">Software Engineer</button>
          <button class="tab-btn" role="tab" aria-selected="false" type="button">Data Scientist</button>
        </div>
        <div class="seg" role="tablist" data-proto-tabs>
          <button class="seg-btn active" role="tab" aria-selected="true" type="button">Top 10</button>
          <button class="seg-btn" role="tab" aria-selected="false" type="button">Around me</button>
        </div>
      </section>

      <section class="fb-section" aria-labelledby="fb-cards">
        <h2 id="fb-cards">Cards</h2>
        <div class="grid-2">
          <article class="card stack">
            <div class="card-head">
              <h3 class="card-title" data-stress>Software Engineer</h3>
              <span class="badge fit-strong">Strong fit, 86%</span>
            </div>
            <div class="cluster cluster-lg">
              <div class="riasec" aria-label="Interest code I R A">
                <span class="riasec-tile" data-dim="I">I</span><span class="riasec-tile" data-dim="R">R</span><span class="riasec-tile" data-dim="A">A</span>
              </div>
              <progress class="progress grow" max="100" value="86" aria-label="Fit 86 percent">86%</progress>
            </div>
            <p class="card-sub">You like solving puzzles and building things that work. This career is mostly that, every day.</p>
            <div class="cluster"><span class="badge fit-good">Good fit</span><span class="badge fit-low">Low fit</span><span class="badge badge-outline">Science (PCM)</span></div>
          </article>
          <article class="card-ink stack">
            <div class="card-head">
              <h3 class="card-title">Tech Thinkers, week 12</h3>
              <span class="live-badge"><span class="live-dot"></span>LIVE</span>
            </div>
            <p class="cluster cluster-between"><span class="muted small">Closes in</span><span class="num stat-value" data-until="2026-11-14T18:00:00+05:30">02:14:37</span></p>
            <div class="grid-3">
              <div class="stack stack-xs"><span class="muted small">Your rank</span><span class="num stat-value">#14</span></div>
              <div class="stack stack-xs"><span class="muted small">Score</span><span class="num stat-value">4/5</span></div>
              <div class="stack stack-xs"><span class="muted small">Streak</span><span class="num stat-value">3 wks</span></div>
            </div>
            <button class="btn btn-primary" type="button">Continue the contest</button>
          </article>
          <div class="card-flat stack-sm stack"><h3 class="card-title">Flat card</h3><p class="card-sub">For dense lists and secondary content.</p></div>
          <div class="card-sunk stack-sm stack"><h3 class="card-title">Sunk well</h3><p class="card-sub">For quiet groupings inside a card.</p></div>
        </div>
      </section>

      <section class="fb-section" aria-labelledby="fb-data">
        <h2 id="fb-data">Data</h2>
        <div class="grid-2">
          <div class="card-flat stack">
            <h3 class="card-title">Your interest areas</h3>
            <div class="bar-row"><span class="bar-row-label"><span class="dim-swatch" data-dim="I"></span>Thinker</span><progress class="progress" data-dim="I" max="100" value="82">82</progress><span class="bar-row-value">82</span></div>
            <div class="bar-row"><span class="bar-row-label"><span class="dim-swatch" data-dim="R"></span>Doer</span><progress class="progress" data-dim="R" max="100" value="71">71</progress><span class="bar-row-value">71</span></div>
            <div class="bar-row"><span class="bar-row-label"><span class="dim-swatch" data-dim="A"></span>Creator</span><progress class="progress" data-dim="A" max="100" value="58">58</progress><span class="bar-row-value">58</span></div>
            <div class="bar-row"><span class="bar-row-label"><span class="dim-swatch" data-dim="C"></span>Organiser</span><progress class="progress" data-dim="C" max="100" value="34">34</progress><span class="bar-row-value">34</span></div>
          </div>
          <div class="card-flat">
            <div class="table-wrap">
              <table class="table">
                <thead><tr><th>Rank</th><th>Student</th><th class="col-num">Score</th></tr></thead>
                <tbody>
                  <tr><td class="num">#1</td><td>Ishita Rao</td><td class="col-num">5/5</td></tr>
                  <tr><td class="num">#2</td><td>Kabir Shah</td><td class="col-num">5/5</td></tr>
                  <tr class="is-me"><td class="num">#14</td><td>You</td><td class="col-num">4/5</td></tr>
                </tbody>
              </table>
            </div>
          </div>
          <div class="grid-2">
            <div class="stat"><span class="stat-value">86%</span><span class="stat-label">Top match</span></div>
            <div class="stat locked"><span class="stat-value"><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-lock"/></svg>Locked</span><span class="stat-label">Take the quiz first</span></div>
          </div>
          <ol class="timeline">
            <li class="tl-item done"><span class="tl-dot"><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-check"/></svg></span><p class="tl-title">Class 10: build your maths base</p><p class="tl-meta">Now</p></li>
            <li class="tl-item current"><span class="tl-dot">2</span><p class="tl-title">Class 11 and 12: Science with PCM</p><p class="tl-meta">2027 to 2029</p></li>
            <li class="tl-item"><span class="tl-dot">3</span><p class="tl-title">Entrance exams: JEE Main</p><p class="tl-meta">2029</p></li>
          </ol>
        </div>
      </section>

      <section class="fb-section" aria-labelledby="fb-feedback">
        <h2 id="fb-feedback">Feedback</h2>
        <div class="grid-2">
          <div class="stack">
            <p class="alert alert-error" role="alert"><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-circle-alert"/></svg><span>That email isn't registered. Check it, or create an account.</span></p>
            <p class="alert alert-ok"><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-check"/></svg><span>Saved. Your profile is up to date.</span></p>
            <p class="alert alert-warn"><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-info"/></svg><span>Removing your School ID will lock the app until you add one again.</span></p>
            <p class="alert alert-info"><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-info"/></svg><span>Results unlock on Sunday at 10 am.</span></p>
          </div>
          <div class="card-flat skeleton-card" aria-hidden="true">
            <div class="skeleton skeleton-title"></div>
            <div class="skeleton skeleton-line w-80"></div>
            <div class="skeleton skeleton-line w-60"></div>
            <div class="cluster"><div class="skeleton skeleton-pill"></div><div class="skeleton skeleton-pill"></div></div>
          </div>
        </div>
        <div class="card-flat">
          <div class="empty">
            <div class="illo illo-lg"><img src="../assets/illustrations/magnifier-400.webp" alt=""></div>
            <h3 class="empty-title">No careers match those filters</h3>
            <p class="empty-text">Try removing the minimum fit, or search for a subject you like.</p>
            <div class="cluster"><button class="btn btn-secondary" type="button">Clear filters</button></div>
          </div>
        </div>
        <div class="fb-illos">
          <div class="illo"><img src="../assets/illustrations/trophy-200.webp" alt=""></div>
          <div class="illo"><img src="../assets/illustrations/rocket-200.webp" alt=""></div>
          <div class="illo"><img src="../assets/illustrations/chat-200.webp" alt=""></div>
          <div class="illo"><img src="../assets/illustrations/lock-200.webp" alt=""></div>
          <div class="illo"><img src="../assets/illustrations/calendar-200.webp" alt=""></div>
          <div class="illo"><img src="../assets/illustrations/target-200.webp" alt=""></div>
          <div class="illo"><img src="../assets/illustrations/star-200.webp" alt=""></div>
          <div class="illo"><img src="../assets/illustrations/thumb-up-200.webp" alt=""></div>
          <div class="illo"><img src="../assets/illustrations/map-pin-200.webp" alt=""></div>
          <div class="illo"><img src="../assets/illustrations/medal-200.webp" alt=""></div>
        </div>
      </section>

      <section class="fb-section" aria-labelledby="fb-people">
        <h2 id="fb-people">People, pills and lists</h2>
        <div class="cluster cluster-lg">
          <span class="avatar">A</span><span class="avatar avatar-lg">A</span>
          <a class="pill" href="#"><span class="pill-num">86%</span>Software Engineer</a>
          <a class="pill" href="#"><span class="pill-num">64%</span><span data-stress>Biomedical Instrumentation Engineer</span></a>
          <span class="icon-tile"><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-sparkles"/></svg></span>
        </div>
        <div class="card-flat list">
          <a class="list-row" href="#"><span class="icon-tile"><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-newspaper"/></svg></span><span class="grow"><span class="list-title">ISRO opens its 2026 young scientist programme</span><br><span class="list-meta">The Hindu, 2 days ago</span></span><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-chevron-right"/></svg></a>
          <a class="list-row" href="#"><span class="icon-tile"><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-briefcase"/></svg></span><span class="grow"><span class="list-title">Summer coding internship for Class 10 to 12</span><br><span class="list-meta">Pune, 6 weeks</span></span><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-chevron-right"/></svg></a>
        </div>
      </section>

      <section class="fb-section" aria-labelledby="fb-overlays">
        <h2 id="fb-overlays">Sheets and drawers</h2>
        <div class="grid-2">
          <div class="sheet fb-demo-sheet" aria-label="Sheet example">
            <div class="sheet-handle"></div>
            <div class="drawer-head"><span class="drawer-title">More</span><button class="btn btn-icon btn-sm" type="button" aria-label="Close"><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-x"/></svg></button></div>
            <div class="drawer-body"><p class="muted">Bottom sheets on phones, drawers on desktop.</p></div>
          </div>
          <div class="drawer fb-demo-drawer" aria-label="Drawer example">
            <div class="drawer-head"><span class="drawer-title">Filters</span><button class="btn btn-icon btn-sm" type="button" aria-label="Close"><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-x"/></svg></button></div>
            <div class="drawer-body"><div class="chip-group"><button class="chip selected" type="button">Science</button><button class="chip" type="button">Commerce</button></div></div>
            <div class="drawer-foot"><button class="btn btn-secondary" type="button">Clear</button><button class="btn btn-primary" type="button">Show 42 careers</button></div>
          </div>
        </div>
      </section>

      <section class="fb-section" aria-labelledby="fb-icons">
        <h2 id="fb-icons">Icons</h2>
        <div class="fb-icons">
          <figure><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-house"/></svg>house</figure>
          <figure><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-compass"/></svg>compass</figure>
          <figure><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-route"/></svg>route</figure>
          <figure><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-trophy"/></svg>trophy</figure>
          <figure><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-message-square"/></svg>message-square</figure>
          <figure><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-ellipsis"/></svg>ellipsis</figure>
          <figure><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-search"/></svg>search</figure>
          <figure><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-newspaper"/></svg>newspaper</figure>
          <figure><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-settings"/></svg>settings</figure>
          <figure><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-brain"/></svg>brain</figure>
          <figure><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-flame"/></svg>flame</figure>
          <figure><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-graduation-cap"/></svg>graduation-cap</figure>
        </div>
      </section>
    </div>
  </template>
</body>
</html>
