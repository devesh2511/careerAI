<!doctype html>
<html lang="en" data-theme="light">
<head>
  <script>(function(){var t=new URLSearchParams(location.search).get('theme');try{t=t||localStorage.getItem('careerai_theme')}catch(e){}document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light')})()</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Find the career that fits you · Crackeer</title>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/layouts.css">
  <script src="../js/proto.js" defer></script>
</head>
<body data-page="landing" data-screen="landing">
  <header class="public-header">
    <a class="logo" href="landing.html">Crackeer<span class="logo-dot">.</span></a>
    <nav class="landing-nav" aria-label="Sections"><a href="#how">How it works</a><a href="#features">What you get</a></nav>
    <div class="cluster"><button class="theme-toggle btn btn-icon" type="button" aria-label="Switch to dark theme" aria-pressed="false"><span class="theme-icon-light"><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-moon"/></svg></span><span class="theme-icon-dark"><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-sun"/></svg></span></button><a class="btn btn-ghost btn-sm landing-login" href="auth.html">Log in</a><a class="btn btn-primary btn-sm" href="auth.html#register">Get started</a></div>
  </header>
  <main class="public-main" data-proto-root></main>

  <template data-state="default" data-label="Landing page">
    <section class="landing-hero" aria-labelledby="lp-title">
      <div class="stack-lg stack">
        <h1 class="landing-title" id="lp-title">Find the career that fits <span class="hl">how you think</span>.</h1>
        <p class="landing-lede">A 25-question quiz, honest career matches and a step-by-step roadmap from Class 9 to your first job. Built for school students in India.</p>
        <div class="cluster cluster-lg">
          <a class="btn btn-primary" href="auth.html#register">Take the career quiz</a>
          <a class="btn btn-secondary" href="auth.html">I have an account</a>
        </div>
        <p class="small muted">You'll create an account first so your results are saved. The quiz takes about 6 minutes.</p>
      </div>
      <div class="landing-visual" aria-hidden="true">
        <div class="card landing-card-main stack">
          <div class="card-head"><div class="stack-xs stack"><span class="small muted">Top match</span><span class="card-title-lg">Software Engineer</span></div><span class="badge fit-strong">86%</span></div>
          <div class="riasec"><span class="riasec-tile" data-dim="I">I</span><span class="riasec-tile" data-dim="R">R</span><span class="riasec-tile" data-dim="A">A</span></div>
          <div class="bar-row"><span class="bar-row-label">Thinker</span><progress class="progress" data-dim="I" max="100" value="82">82</progress><span class="bar-row-value">82</span></div>
          <div class="bar-row"><span class="bar-row-label">Doer</span><progress class="progress" data-dim="R" max="100" value="71">71</progress><span class="bar-row-value">71</span></div>
        </div>
        <div class="landing-row">
          <div class="illo landing-illo"><img src="../assets/illustrations/rocket-400.webp" alt=""></div>
          <div class="card-ink landing-card-contest stack-sm stack">
            <div class="cluster cluster-between"><span class="card-title">Saturday contest</span><span class="live-badge"><span class="live-dot"></span>LIVE</span></div>
            <span class="countdown">02:14:37</span>
          </div>
        </div>
      </div>
    </section>

    <section class="landing-facts" aria-label="At a glance">
      <div><span class="stat-value">25</span><span class="stat-label">questions about what you enjoy</span></div>
      <div><span class="stat-value">6 min</span><span class="stat-label">to finish the quiz</span></div>
      <div><span class="stat-value">300+</span><span class="stat-label">careers with roadmaps</span></div>
      <div><span class="stat-value">Every Sat</span><span class="stat-label">a new 5-question contest</span></div>
    </section>

    <section class="landing-section" id="how" aria-labelledby="lp-how">
      <h2 id="lp-how">How it works</h2>
      <ol class="landing-steps">
        <li><span class="tl-dot">1</span><div><h3>Sign up</h3><p class="muted">Use the School ID from your school, or get your own plan.</p></div></li>
        <li><span class="tl-dot">2</span><div><h3>Take the quiz</h3><p class="muted">25 questions about what you like doing. No marks, no wrong answers.</p></div></li>
        <li><span class="tl-dot">3</span><div><h3>See your matches</h3><p class="muted">Careers ranked by how well they fit your interests, subjects and stream.</p></div></li>
        <li><span class="tl-dot">4</span><div><h3>Follow your roadmap</h3><p class="muted">What to study, which exams to take and when, year by year.</p></div></li>
      </ol>
    </section>

    <section class="landing-section" id="features" aria-labelledby="lp-features">
      <h2 id="lp-features">What you get</h2>
      <div class="grid-3">
        <div class="card-flat stack-sm stack"><span class="icon-tile"><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-list-checks"/></svg></span><h3>Career quiz</h3><p class="muted">Finds your interest code from six areas, from Doer to Organiser.</p></div>
        <div class="card-flat stack-sm stack"><span class="icon-tile"><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-compass"/></svg></span><h3>Career matches</h3><p class="muted">Every match comes with a fit score and the reason it suits you.</p></div>
        <div class="card-flat stack-sm stack"><span class="icon-tile"><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-route"/></svg></span><h3>Roadmaps</h3><p class="muted">Stream, subjects, entrance exams and colleges, in order.</p></div>
        <div class="card-flat stack-sm stack"><span class="icon-tile"><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-message-square"/></svg></span><h3>AI Chat</h3><p class="muted">Ask anything about a career and get answers that know your results.</p></div>
        <div class="card-flat stack-sm stack"><span class="icon-tile"><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-trophy"/></svg></span><h3>Weekly contests</h3><p class="muted">Five questions every Saturday, a leaderboard and a streak to keep.</p></div>
        <div class="card-flat stack-sm stack"><span class="icon-tile"><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-newspaper"/></svg></span><h3>Career Space</h3><p class="muted">News, internships and jobs for the career you picked.</p></div>
      </div>
    </section>

    <section class="card-ink landing-final" aria-labelledby="lp-final">
      <div class="stack-sm stack"><h2 class="card-title-lg" id="lp-final">Six minutes now saves a lot of guessing later.</h2><p class="muted">Start with the quiz. Your matches and roadmap are ready the moment you finish.</p></div>
      <a class="btn btn-primary" href="auth.html#register">Take the career quiz</a>
    </section>

    <footer class="landing-footer">
      <span class="logo">Crackeer<span class="logo-dot">.</span></span>
      <nav class="cluster cluster-lg" aria-label="Footer"><a href="auth.html">Log in</a><a href="auth.html#register">Create an account</a><a href="#">School admin login</a></nav>
      <p class="small muted">Made for students in Classes 8 to 12.</p>
    </footer>
  </template>
</body>
</html>
