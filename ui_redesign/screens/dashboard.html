<!doctype html>
<html lang="en" data-theme="light">
<head>
  <script>(function(){var t=new URLSearchParams(location.search).get('theme');try{t=t||localStorage.getItem('careerai_theme')}catch(e){}document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light')})()</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Home · Crackeer</title>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/layouts.css">
  <script src="../js/shell.js" defer></script>
  <script src="../js/proto.js" defer></script>
</head>
<body data-page="app" data-screen="dashboard">
  <div data-shell="app" data-active="dashboard" data-live="true"></div>
  <main class="app-main" data-proto-root></main>

  <!-- ============ Before the career quiz ============ -->
  <template data-state="before-quiz" data-label="Before the quiz" data-shell-live="false">
    <div class="page page-dashboard">
      <header class="page-head">
        <div>
          <p class="muted small">Saturday, 8 November</p>
          <h1 id="db-title">Hey Aarav, let's find <span class="hl">your direction</span>.</h1>
          <p class="page-sub" id="db-sub">Answer 25 quick questions about what you enjoy. We'll match you with careers and build a step-by-step roadmap for the one you pick.</p>
        </div>
      </header>

      <div id="db-main" class="grid-main-side">
        <section class="card hero-card hero-card-media" aria-labelledby="db-quiz-title">
          <div class="illo illo-lg"><img src="../assets/illustrations/rocket-400.webp" alt=""></div>
          <div class="stack">
            <div class="stack-sm stack">
              <h2 class="card-title-lg" id="db-quiz-title">Take the career quiz</h2>
              <p class="card-sub">25 questions and about 6 minutes. There are no right or wrong answers, just pick what sounds like you.</p>
            </div>
            <div class="cluster cluster-lg">
              <button class="btn btn-primary" id="db-cta-btn" type="button">Start the quiz</button>
              <span class="small muted">You can pause and come back.</span>
            </div>
          </div>
        </section>

        <aside class="card-flat stack" aria-labelledby="db-contest-locked">
          <div class="cluster cluster-lg">
            <div class="illo illo-sm"><img src="../assets/illustrations/trophy-200.webp" alt=""></div>
            <div class="grow stack-xs stack">
              <h2 class="card-title" id="db-contest-locked">Weekly contests</h2>
              <p class="card-sub">Five questions every Saturday about your future career. They unlock once you have a career match.</p>
            </div>
          </div>
        </aside>
      </div>

      <section class="section" aria-labelledby="db-stats-title">
        <h2 id="db-stats-title" class="visually-hidden">Your progress</h2>
        <div class="grid-stats" id="db-stats">
          <div class="stat locked"><span class="stat-value"><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-lock"/></svg>Locked</span><span class="stat-label">Top match</span></div>
          <div class="stat locked"><span class="stat-value"><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-lock"/></svg>Locked</span><span class="stat-label">Strong matches</span></div>
          <div class="stat locked"><span class="stat-value"><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-lock"/></svg>Locked</span><span class="stat-label">Roadmap progress</span></div>
          <div class="stat locked"><span class="stat-value"><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-lock"/></svg>Locked</span><span class="stat-label">Contest streak</span></div>
        </div>
      </section>

      <section class="section" aria-labelledby="db-try-title">
        <h2 id="db-try-title">While you're here</h2>
        <div class="grid-2">
          <a class="card-flat card-link action-card" href="explore.html">
            <span class="icon-tile"><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-search"/></svg></span>
            <span class="stack-xs stack"><span class="card-title">Explore careers</span><span class="card-sub">Browse 300+ careers by subject, stream and salary.</span></span>
          </a>
          <a class="card-flat card-link action-card" href="chat.html">
            <span class="icon-tile"><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-message-square"/></svg></span>
            <span class="stack-xs stack"><span class="card-title">Ask AI Chat</span><span class="card-sub">Not sure what a career involves? Ask anything.</span></span>
          </a>
        </div>
      </section>
    </div>
  </template>

  <!-- ============ With quiz results ============ -->
  <template data-state="with-results" data-label="With results">
    <div class="page page-dashboard">
      <header class="page-head">
        <div>
          <p class="muted small">Saturday, 8 November</p>
          <h1 id="db-title">Hey Aarav, <span class="hl">your path</span> is taking shape.</h1>
          <p class="page-sub" id="db-sub">You lean towards careers that mix solving problems with building real things. Here's what to do next.</p>
        </div>
      </header>

      <div id="db-main" class="grid-main-side">
        <div class="stack-lg stack">
          <section class="card stack" aria-labelledby="db-top-title">
            <div class="card-head">
              <div class="stack-xs stack">
                <p class="small muted">Your top match</p>
                <h2 class="card-title-lg" id="db-top-title" data-stress>Software Engineer</h2>
              </div>
              <span class="badge fit-strong">Strong fit, 86%</span>
            </div>
            <div class="cluster cluster-lg">
              <div class="riasec" aria-label="Your interest code: Thinker, Doer, Creator">
                <span class="riasec-tile" data-dim="I">I</span><span class="riasec-tile" data-dim="R">R</span><span class="riasec-tile" data-dim="A">A</span>
              </div>
              <p class="dim-names">Thinker, Doer, Creator</p>
            </div>
            <p>You enjoy figuring out how things work and you like making something you can show people. Software engineers spend most days doing exactly that.</p>
            <div class="cluster cluster-lg">
              <a class="btn btn-primary" id="db-cta-btn" href="roadmap.html"><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-route"/></svg>Open my roadmap</a>
              <a class="btn btn-ghost" href="career-matches.html">See all matches</a>
            </div>
          </section>

          <section class="card-flat stack" aria-labelledby="db-next-title">
            <div class="section-head">
              <h2 class="card-title" id="db-next-title">Next on your roadmap</h2>
              <span class="small muted">Stage 1 of 5</span>
            </div>
            <ol class="timeline">
              <li class="tl-item current">
                <span class="tl-dot">1</span>
                <p class="tl-title">Class 10: build your maths base</p>
                <div class="tl-body"><ul><li>Aim for 85% or more in maths and science</li><li>Try one free coding course, such as Python basics</li></ul></div>
              </li>
              <li class="tl-item">
                <span class="tl-dot">2</span>
                <p class="tl-title">Class 11 and 12: Science with PCM</p>
                <p class="tl-meta">2027 to 2029</p>
              </li>
            </ol>
            <a class="btn btn-secondary btn-sm" href="roadmap.html">View full roadmap</a>
          </section>
        </div>

        <aside class="stack-lg stack">
          <section class="card-ink stack" aria-labelledby="db-contest-title">
            <div class="card-head">
              <h2 class="card-title" id="db-contest-title">Tech Thinkers, week 12</h2>
              <span class="live-badge"><span class="live-dot"></span>LIVE</span>
            </div>
            <div class="stack-xs stack">
              <span class="muted small">Closes in</span>
              <span class="countdown" data-until="2026-11-08T21:00:00+05:30">02:14:37</span>
            </div>
            <div class="metric-row">
              <div class="metric"><span class="metric-value">#14</span><span class="metric-label">Last rank</span></div>
              <div class="metric"><span class="metric-value">4/5</span><span class="metric-label">Last score</span></div>
              <div class="metric"><span class="metric-value"><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-flame"/></svg>3</span><span class="metric-label">Week streak</span></div>
            </div>
            <a class="btn btn-primary" href="contest.html?state=intro">Play this week's contest</a>
          </section>

          <section class="card-flat stack-sm stack" aria-labelledby="db-careers-title">
            <h2 class="card-title" id="db-careers-title">Your other matches</h2>
            <div class="stack-sm stack">
              <a class="pill career-pill" data-career="Data Scientist" href="career-detail.html"><span class="pill-num">81%</span>Data Scientist</a>
              <a class="pill career-pill" data-career="Robotics Engineer" href="career-detail.html"><span class="pill-num">77%</span>Robotics Engineer</a>
              <a class="pill career-pill" data-career="Architect" href="career-detail.html"><span class="pill-num">69%</span>Architect</a>
              <a class="pill career-pill" data-career="Biomedical Instrumentation Engineer" href="career-detail.html"><span class="pill-num">64%</span><span data-stress>Biomedical Instrumentation Engineer</span></a>
            </div>
          </section>
        </aside>
      </div>

      <section class="section" aria-labelledby="db-stats-title">
        <h2 id="db-stats-title" class="visually-hidden">Your progress</h2>
        <div class="grid-stats" id="db-stats">
          <div class="stat"><span class="stat-value">86%</span><span class="stat-label">Top match</span></div>
          <div class="stat"><span class="stat-value">3</span><span class="stat-label">Strong matches</span></div>
          <div class="stat"><span class="stat-value">1 of 5</span><span class="stat-label">Roadmap stage</span></div>
          <div class="stat"><span class="stat-value">3 weeks</span><span class="stat-label">Contest streak</span></div>
        </div>
      </section>

      <section class="section" aria-labelledby="db-more-title">
        <h2 id="db-more-title">Keep exploring</h2>
        <div class="grid-2">
          <a class="card-flat card-link action-card" href="explore.html">
            <span class="icon-tile"><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-search"/></svg></span>
            <span class="stack-xs stack"><span class="card-title">Explore careers</span><span class="card-sub">Compare careers by stream, salary and fit.</span></span>
          </a>
          <a class="card-flat card-link action-card" href="chat.html">
            <span class="icon-tile"><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-message-square"/></svg></span>
            <span class="stack-xs stack"><span class="card-title">Ask AI Chat</span><span class="card-sub">"Which entrance exams do I need for software engineering?"</span></span>
          </a>
          <a class="card-flat card-link action-card" href="career-space.html">
            <span class="icon-tile"><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-newspaper"/></svg></span>
            <span class="stack-xs stack"><span class="card-title">Career Space</span><span class="card-sub">News, internships and jobs for Software Engineer.</span></span>
          </a>
          <a class="card-flat card-link action-card" href="career-results.html?print=1">
            <span class="icon-tile"><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-download"/></svg></span>
            <span class="stack-xs stack"><span class="card-title">Download your report</span><span class="card-sub">A printable PDF of your quiz results.</span></span>
          </a>
        </div>
      </section>
    </div>
  </template>
</body>
</html>
