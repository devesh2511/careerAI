<!doctype html>
<html lang="en" data-theme="light">
<head>
  <script>(function(){var t=new URLSearchParams(location.search).get('theme');try{t=t||localStorage.getItem('careerai_theme')}catch(e){}document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light')})()</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Career Space · Crackeer</title>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/layouts.css">
  <script src="../js/shell.js" defer></script>
  <script src="../js/proto.js" defer></script>
</head>
<body data-page="app" data-screen="career-space">
  <div data-shell="app" data-active="space" data-live="true"></div>
  <main class="app-main" data-proto-root></main>

  <template data-state="feed" data-label="News feed">
    <div class="page">
      <header class="page-head"><div><h1>Career Space</h1><p class="page-sub">News, internships and jobs for the careers you're following.</p></div></header>
      <div class="cluster" id="sp-careers" aria-label="Careers"><button class="pill career-pill selected" type="button" data-career="Software Engineer" aria-pressed="true">Software Engineer</button><button class="pill career-pill" type="button" data-career="Data Scientist" aria-pressed="false">Data Scientist</button><button class="pill career-pill" type="button" data-career="Robotics Engineer" aria-pressed="false">Robotics Engineer</button></div>
      <div class="tabs" id="sp-tabs" role="tablist" aria-label="Type" data-proto-tabs><button class="tab-btn active" role="tab" aria-selected="true" type="button">News</button><button class="tab-btn" role="tab" aria-selected="false" type="button">Internships</button><button class="tab-btn" role="tab" aria-selected="false" type="button">Jobs</button><button class="tab-btn" role="tab" aria-selected="false" type="button">Exams</button></div>
<div id="sp-note" hidden></div>
      <section class="card-flat list" id="sp-feed" aria-label="News"><a class="list-row sp-item" href="https://example.com/career-space" target="_blank" rel="noopener"><span class="sp-thumb icon-tile"><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-newspaper"/></svg></span><span class="grow"><span class="list-title" data-stress>A free online coding course for Classes 9 to 12 opens this month</span><br><span class="list-meta">Career Weekly, 2 days ago</span></span><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-external-link"/></svg><span class="visually-hidden"> (opens in a new tab)</span></a><a class="list-row sp-item" href="https://example.com/career-space" target="_blank" rel="noopener"><span class="sp-thumb icon-tile"><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-sparkles"/></svg></span><span class="grow"><span class="list-title" data-stress>What software engineers actually do all day, in their own words</span><br><span class="list-meta">Campus Notes, 4 days ago</span></span><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-external-link"/></svg><span class="visually-hidden"> (opens in a new tab)</span></a><a class="list-row sp-item" href="https://example.com/career-space" target="_blank" rel="noopener"><span class="sp-thumb icon-tile"><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-graduation-cap"/></svg></span><span class="grow"><span class="list-title" data-stress>JEE Main 2027: registration dates and syllabus changes explained</span><br><span class="list-meta">Exam Desk, 1 week ago</span></span><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-external-link"/></svg><span class="visually-hidden"> (opens in a new tab)</span></a><a class="list-row sp-item" href="https://example.com/career-space" target="_blank" rel="noopener"><span class="sp-thumb icon-tile"><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-briefcase"/></svg></span><span class="grow"><span class="list-title" data-stress>Why product companies are hiring more freshers this year</span><br><span class="list-meta">Tech Jobs India, 1 week ago</span></span><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-external-link"/></svg><span class="visually-hidden"> (opens in a new tab)</span></a></section>
      <div class="cluster cluster-between" id="sp-foot"><p class="small muted">Showing 4 of 40</p><button class="btn btn-secondary btn-sm" type="button">Load more</button></div>
    </div>
  </template>

  <template data-state="tab-switched" data-label="Internships tab">
    <div class="page">
      <header class="page-head"><div><h1>Career Space</h1><p class="page-sub">News, internships and jobs for the careers you're following.</p></div></header>
      <div class="cluster" id="sp-careers" aria-label="Careers"><button class="pill career-pill selected" type="button" data-career="Software Engineer" aria-pressed="true">Software Engineer</button><button class="pill career-pill" type="button" data-career="Data Scientist" aria-pressed="false">Data Scientist</button><button class="pill career-pill" type="button" data-career="Robotics Engineer" aria-pressed="false">Robotics Engineer</button></div>
      <div class="tabs" id="sp-tabs" role="tablist" aria-label="Type" data-proto-tabs><button class="tab-btn" role="tab" aria-selected="false" type="button">News</button><button class="tab-btn active" role="tab" aria-selected="true" type="button">Internships</button><button class="tab-btn" role="tab" aria-selected="false" type="button">Jobs</button><button class="tab-btn" role="tab" aria-selected="false" type="button">Exams</button></div>
<div id="sp-note" hidden></div>
      <section class="card-flat list" id="sp-feed" aria-label="Internships"><a class="list-row sp-item" href="https://example.com/career-space" target="_blank" rel="noopener"><span class="sp-thumb icon-tile"><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-briefcase"/></svg></span><span class="grow"><span class="list-title" data-stress>Summer coding internship for Class 10 to 12 students, Pune</span><br><span class="list-meta">Young Builders Lab, 6 weeks, unpaid</span></span><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-external-link"/></svg><span class="visually-hidden"> (opens in a new tab)</span></a><a class="list-row sp-item" href="https://example.com/career-space" target="_blank" rel="noopener"><span class="sp-thumb icon-tile"><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-briefcase"/></svg></span><span class="grow"><span class="list-title" data-stress>App design bootcamp with a final project showcase</span><br><span class="list-meta">Studio Seven, 4 weeks, online</span></span><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-external-link"/></svg><span class="visually-hidden"> (opens in a new tab)</span></a></section>
      <div class="cluster cluster-between" id="sp-foot"><p class="small muted">Showing 2 of 40</p><button class="btn btn-secondary btn-sm" type="button">Load more</button></div>
    </div>
  </template>

  <template data-state="error" data-label="Could not load">
    <div class="page">
      <header class="page-head"><div><h1>Career Space</h1><p class="page-sub">News, internships and jobs for the careers you're following.</p></div></header>
      <div class="cluster" id="sp-careers" aria-label="Careers"><button class="pill career-pill selected" type="button" data-career="Software Engineer" aria-pressed="true">Software Engineer</button><button class="pill career-pill" type="button" data-career="Data Scientist" aria-pressed="false">Data Scientist</button><button class="pill career-pill" type="button" data-career="Robotics Engineer" aria-pressed="false">Robotics Engineer</button></div>
      <div class="tabs" id="sp-tabs" role="tablist" aria-label="Type" data-proto-tabs><button class="tab-btn active" role="tab" aria-selected="true" type="button">News</button><button class="tab-btn" role="tab" aria-selected="false" type="button">Internships</button><button class="tab-btn" role="tab" aria-selected="false" type="button">Jobs</button><button class="tab-btn" role="tab" aria-selected="false" type="button">Exams</button></div>
      <div class="alert alert-error" id="sp-note" role="alert"><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-circle-alert"/></svg><div class="stack-sm stack"><span>We couldn't load news right now. Check your connection.</span><div><button class="btn btn-secondary btn-sm" type="button"><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-refresh-cw"/></svg>Try again</button></div></div></div>
      <section class="card-flat list" id="sp-feed" aria-label="News"></section>
      <div class="cluster cluster-between" id="sp-foot" hidden><p class="small muted">Showing 0 of 40</p><button class="btn btn-secondary btn-sm" type="button">Load more</button></div>
    </div>
  </template>

  <template data-state="empty" data-label="Nothing listed">
    <div class="page">
      <header class="page-head"><div><h1>Career Space</h1><p class="page-sub">News, internships and jobs for the careers you're following.</p></div></header>
      <div class="cluster" id="sp-careers" aria-label="Careers"><button class="pill career-pill selected" type="button" data-career="Software Engineer" aria-pressed="true">Software Engineer</button><button class="pill career-pill" type="button" data-career="Data Scientist" aria-pressed="false">Data Scientist</button><button class="pill career-pill" type="button" data-career="Robotics Engineer" aria-pressed="false">Robotics Engineer</button></div>
      <div class="tabs" id="sp-tabs" role="tablist" aria-label="Type" data-proto-tabs><button class="tab-btn" role="tab" aria-selected="false" type="button">News</button><button class="tab-btn" role="tab" aria-selected="false" type="button">Internships</button><button class="tab-btn active" role="tab" aria-selected="true" type="button">Jobs</button><button class="tab-btn" role="tab" aria-selected="false" type="button">Exams</button></div>
      <section class="card-flat" id="sp-note">
        <div class="empty">
          <div class="illo illo-lg"><img src="../assets/illustrations/magnifier-400.webp" alt=""></div>
          <h2 class="empty-title">No jobs listed for Software Engineer yet</h2>
          <p class="empty-text">New listings arrive every week. Check the News and Internships tabs for now.</p>
          <div class="cluster"><button class="btn btn-secondary" type="button">See internships</button></div>
        </div>
      </section>
      <section class="card-flat list" id="sp-feed" aria-label="Jobs"></section>
      <div class="cluster cluster-between" id="sp-foot" hidden><p class="small muted">Showing 0 of 40</p><button class="btn btn-secondary btn-sm" type="button">Load more</button></div>
    </div>
  </template>
</body>
</html>
