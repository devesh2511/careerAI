<!doctype html>
<html lang="en" data-theme="light">
<head>
  <script>(function(){var t=new URLSearchParams(location.search).get('theme');try{t=t||localStorage.getItem('careerai_theme')}catch(e){}document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light')})()</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Log in · Crackeer</title>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/layouts.css">
  <script src="../js/proto.js" defer></script>
</head>
<body data-page="auth" data-screen="auth">
  <header class="public-header">
    <a class="logo" href="landing.html">Crackeer<span class="logo-dot">.</span></a>
    <div class="cluster"><button class="theme-toggle btn btn-icon" type="button" aria-label="Switch to dark theme" aria-pressed="false"><span class="theme-icon-light"><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-moon"/></svg></span><span class="theme-icon-dark"><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-sun"/></svg></span></button><a class="btn btn-secondary btn-sm" href="landing.html">Home</a></div>
  </header>
  <main class="public-main" data-proto-root></main>

  <template data-state="login" data-label="Log in">
    <div class="auth-wrap">
      <form class="card auth-card stack" id="auth-login" novalidate>
        <div class="tabs auth-tabs" id="auth-tabs" role="tablist" aria-label="Account"><a class="tab-btn auth-tab active" aria-selected="true" role="tab" href="auth.html">Log in</a><a class="tab-btn auth-tab" aria-selected="false" role="tab" href="auth.html#register">Create account</a></div>
        <div class="stack-xs stack"><h1 class="auth-title">Welcome back</h1><p class="muted">Log in to see your matches, roadmap and contests.</p></div>
        <div class="alert alert-ok" id="login-ok" role="status" hidden><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-check"/></svg><span>Password changed. Log in with your new password.</span></div>
        <div class="alert alert-error" id="login-alert" role="alert" hidden><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-circle-alert"/></svg><span>That email and password don't match. Check them, or reset your password.</span></div>
        <div class="field"><label class="field-label" for="login-email">Email</label><input class="input" id="login-email" type="email" placeholder="you@example.com" autocomplete="email" aria-describedby="login-email-error"><p class="form-error" id="login-email-error" hidden><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-circle-alert"/></svg></p></div>
        <div class="field"><label class="field-label" for="login-password">Password</label><div class="password-field"><input class="input" id="login-password" type="password" autocomplete="current-password" aria-describedby="login-password-error"><button class="password-toggle" type="button" aria-label="Show password"><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-eye"/></svg></button></div><p class="form-error" id="login-password-error" hidden><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-circle-alert"/></svg></p></div>
        <div class="auth-row"><a class="small" href="auth.html#forgot">Forgot password?</a></div>
        <button class="btn btn-primary btn-block" id="login-btn" type="submit">Log in</button>
        <p class="small muted auth-switch">New here? <a href="auth.html#register">Create an account</a></p>
      </form>
    </div>
  </template>

  <template data-state="login-error" data-label="Log in, wrong password">
    <div class="auth-wrap">
      <form class="card auth-card stack" id="auth-login" novalidate>
        <div class="tabs auth-tabs" id="auth-tabs" role="tablist" aria-label="Account"><a class="tab-btn auth-tab active" aria-selected="true" role="tab" href="auth.html">Log in</a><a class="tab-btn auth-tab" aria-selected="false" role="tab" href="auth.html#register">Create account</a></div>
        <div class="stack-xs stack"><h1 class="auth-title">Welcome back</h1><p class="muted">Log in to see your matches, roadmap and contests.</p></div>
        <div class="alert alert-ok" id="login-ok" role="status" hidden><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-check"/></svg><span>Password changed. Log in with your new password.</span></div>
        <div class="alert alert-error" id="login-alert" role="alert"><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-circle-alert"/></svg><span>That email and password don't match. Check them, or reset your password.</span></div>
        <div class="field"><label class="field-label" for="login-email">Email</label><input class="input" id="login-email" type="email" value="aarav.m@gmail.com" placeholder="you@example.com" autocomplete="email" aria-describedby="login-email-error"><p class="form-error" id="login-email-error" hidden><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-circle-alert"/></svg></p></div>
        <div class="field"><label class="field-label" for="login-password">Password</label><div class="password-field"><input class="input" id="login-password" type="password" value="notebook1" autocomplete="current-password" aria-describedby="login-password-error"><button class="password-toggle" type="button" aria-label="Show password"><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-eye"/></svg></button></div><p class="form-error" id="login-password-error" hidden><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-circle-alert"/></svg></p></div>
        <div class="auth-row"><a class="small" href="auth.html#forgot">Forgot password?</a></div>
        <button class="btn btn-primary btn-block" id="login-btn" type="submit">Log in</button>
        <p class="small muted auth-switch">New here? <a href="auth.html#register">Create an account</a></p>
      </form>
    </div>
  </template>

  <template data-state="register" data-label="Create account">
    <div class="auth-wrap">
      <form class="card auth-card stack" id="auth-register" novalidate>
        <div class="tabs auth-tabs" id="auth-tabs" role="tablist" aria-label="Account"><a class="tab-btn auth-tab" aria-selected="false" role="tab" href="auth.html">Log in</a><a class="tab-btn auth-tab active" aria-selected="true" role="tab" href="auth.html#register">Create account</a></div>
        <div class="stack-xs stack"><h1 class="auth-title">Create your account</h1><p class="muted">Takes a minute. Your quiz results are saved to this account.</p></div>
        <div class="alert alert-error" id="reg-alert" role="alert" hidden><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-circle-alert"/></svg><span>Fix the 4 highlighted fields to create your account.</span></div>
        <div class="field"><label class="field-label" for="reg-full_name">Full name</label><input class="input" id="reg-full_name" type="text" placeholder="Aarav Mehta" autocomplete="name" aria-describedby="reg-full_name-error"><p class="form-error" id="reg-full_name-error" hidden><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-circle-alert"/></svg></p></div>
        <div class="field"><label class="field-label" for="reg-school_code">School ID <span class="optional">(optional)</span></label><input class="input" id="reg-school_code" type="text" placeholder="e.g. DPS-RKP" aria-describedby="reg-school_code-error" autocapitalize="characters"><p class="field-hint">From your school. You can add it later.</p><p class="form-error" id="reg-school_code-error" hidden><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-circle-alert"/></svg></p></div>
        <div class="field"><label class="field-label" for="reg-email">Email</label><input class="input" id="reg-email" type="email" placeholder="you@example.com" autocomplete="email" aria-describedby="reg-email-error"><p class="form-error" id="reg-email-error" hidden><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-circle-alert"/></svg></p></div>
        <div class="field"><label class="field-label" for="reg-password">Password</label><div class="password-field"><input class="input" id="reg-password" type="password" autocomplete="new-password" aria-describedby="reg-password-error"><button class="password-toggle" type="button" aria-label="Show password"><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-eye"/></svg></button></div><p class="field-hint">At least 8 characters.</p><p class="form-error" id="reg-password-error" hidden><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-circle-alert"/></svg></p></div>
        <div class="field"><label class="field-label" for="reg-confirm">Confirm password</label><div class="password-field"><input class="input" id="reg-confirm" type="password" autocomplete="new-password" aria-describedby="reg-confirm-error"><button class="password-toggle" type="button" aria-label="Show password"><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-eye"/></svg></button></div><p class="form-error" id="reg-confirm-error" hidden><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-circle-alert"/></svg></p></div>
        <button class="btn btn-primary btn-block" id="reg-btn" type="submit">Create account</button>
        <p class="small muted auth-switch">Already have an account? <a href="auth.html">Log in</a></p>
      </form>
    </div>
  </template>

  <template data-state="register-errors" data-label="Create account, field errors">
    <div class="auth-wrap">
      <form class="card auth-card stack" id="auth-register" novalidate>
        <div class="tabs auth-tabs" id="auth-tabs" role="tablist" aria-label="Account"><a class="tab-btn auth-tab" aria-selected="false" role="tab" href="auth.html">Log in</a><a class="tab-btn auth-tab active" aria-selected="true" role="tab" href="auth.html#register">Create account</a></div>
        <div class="stack-xs stack"><h1 class="auth-title">Create your account</h1><p class="muted">Takes a minute. Your quiz results are saved to this account.</p></div>
        <div class="alert alert-error" id="reg-alert" role="alert"><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-circle-alert"/></svg><span>Fix the 4 highlighted fields to create your account.</span></div>
        <div class="field"><label class="field-label" for="reg-full_name">Full name</label><input class="input is-invalid" id="reg-full_name" type="text" placeholder="Aarav Mehta" autocomplete="name" aria-describedby="reg-full_name-error" aria-invalid="true"><p class="form-error" id="reg-full_name-error"><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-circle-alert"/></svg>Enter your full name.</p></div>
        <div class="field"><label class="field-label" for="reg-school_code">School ID <span class="optional">(optional)</span></label><input class="input" id="reg-school_code" type="text" value="DPS-RKP" placeholder="e.g. DPS-RKP" aria-describedby="reg-school_code-error" autocapitalize="characters"><p class="field-hint">From your school. You can add it later.</p><p class="form-error" id="reg-school_code-error" hidden><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-circle-alert"/></svg></p></div>
        <div class="field"><label class="field-label" for="reg-email">Email</label><input class="input is-invalid" id="reg-email" type="email" value="aarav.m@gmail.com" placeholder="you@example.com" autocomplete="email" aria-describedby="reg-email-error" aria-invalid="true"><p class="form-error" id="reg-email-error"><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-circle-alert"/></svg>That email already has an account. Log in instead.</p></div>
        <div class="field"><label class="field-label" for="reg-password">Password</label><div class="password-field"><input class="input is-invalid" id="reg-password" type="password" value="notebk" autocomplete="new-password" aria-describedby="reg-password-error" aria-invalid="true"><button class="password-toggle" type="button" aria-label="Show password"><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-eye"/></svg></button></div><p class="field-hint">At least 8 characters.</p><p class="form-error" id="reg-password-error"><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-circle-alert"/></svg>Use at least 8 characters.</p></div>
        <div class="field"><label class="field-label" for="reg-confirm">Confirm password</label><div class="password-field"><input class="input is-invalid" id="reg-confirm" type="password" value="notebok" autocomplete="new-password" aria-describedby="reg-confirm-error" aria-invalid="true"><button class="password-toggle" type="button" aria-label="Show password"><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-eye"/></svg></button></div><p class="form-error" id="reg-confirm-error"><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-circle-alert"/></svg>Passwords don't match yet.</p></div>
        <button class="btn btn-primary btn-block" id="reg-btn" type="submit">Create account</button>
        <p class="small muted auth-switch">Already have an account? <a href="auth.html">Log in</a></p>
      </form>
    </div>
  </template>

  <template data-state="forgot" data-label="Forgot password">
    <div class="auth-wrap">
      <form class="card auth-card stack" id="auth-forgot" novalidate>
        <div class="tabs auth-tabs" id="auth-tabs" role="tablist" aria-label="Account" hidden><a class="tab-btn auth-tab" aria-selected="false" role="tab" href="auth.html">Log in</a><a class="tab-btn auth-tab" aria-selected="false" role="tab" href="auth.html#register">Create account</a></div>
        <a class="btn btn-ghost btn-sm auth-back" href="auth.html"><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-arrow-left"/></svg>Back to log in</a>
        <div class="stack-xs stack"><h1 class="auth-title">Reset your password</h1><p class="muted">Enter the email you signed up with. We'll send you a 6-digit code.</p></div>
        <div class="field"><label class="field-label" for="forgot-email">Email</label><input class="input" id="forgot-email" type="email" placeholder="you@example.com" autocomplete="email" aria-describedby="forgot-email-error"><p class="form-error" id="forgot-email-error" hidden><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-circle-alert"/></svg></p></div>
        <button class="btn btn-primary btn-block" id="forgot-btn" type="submit">Send code</button>
      </form>
    </div>
  </template>

  <template data-state="reset" data-label="Reset with code">
    <div class="auth-wrap">
      <form class="card auth-card stack" id="auth-reset" novalidate>
        <div class="tabs auth-tabs" id="auth-tabs" role="tablist" aria-label="Account" hidden><a class="tab-btn auth-tab" aria-selected="false" role="tab" href="auth.html">Log in</a><a class="tab-btn auth-tab" aria-selected="false" role="tab" href="auth.html#register">Create account</a></div>
        <a class="btn btn-ghost btn-sm auth-back" href="auth.html#forgot"><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-arrow-left"/></svg>Use a different email</a>
        <div class="stack-xs stack"><h1 class="auth-title">Check your email</h1><p class="muted">We sent a 6-digit code to <b id="reset-to">aarav.m@gmail.com</b>. It works for 15 minutes.</p></div>
        <div class="alert alert-error" id="reset-alert" role="alert" hidden><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-circle-alert"/></svg><span>That code has expired. Send a new one.</span></div>
        <div class="field"><label class="field-label" for="reset-code">6-digit code</label><input class="input" id="reset-code" type="text" placeholder="123456" autocomplete="one-time-code" aria-describedby="reset-code-error" inputmode="numeric" maxlength="6"><p class="form-error" id="reset-code-error" hidden><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-circle-alert"/></svg></p></div>
        <div class="field"><label class="field-label" for="reset-new_password">New password</label><div class="password-field"><input class="input" id="reset-new_password" type="password" autocomplete="new-password" aria-describedby="reset-new_password-error"><button class="password-toggle" type="button" aria-label="Show password"><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-eye"/></svg></button></div><p class="field-hint">At least 8 characters.</p><p class="form-error" id="reset-new_password-error" hidden><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-circle-alert"/></svg></p></div>
        <div class="field"><label class="field-label" for="reset-confirm">Confirm new password</label><div class="password-field"><input class="input" id="reset-confirm" type="password" autocomplete="new-password" aria-describedby="reset-confirm-error"><button class="password-toggle" type="button" aria-label="Show password"><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-eye"/></svg></button></div><p class="form-error" id="reset-confirm-error" hidden><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-circle-alert"/></svg></p></div>
        <button class="btn btn-primary btn-block" id="reset-btn" type="submit">Change password</button>
        <button class="btn btn-ghost btn-sm auth-resend" id="reset-resend-btn" type="button" disabled>Resend code in 0:42</button>
      </form>
    </div>
  </template>

  <template data-state="success" data-label="Password changed">
    <div class="auth-wrap">
      <form class="card auth-card stack" id="auth-login" novalidate>
        <div class="tabs auth-tabs" id="auth-tabs" role="tablist" aria-label="Account"><a class="tab-btn auth-tab active" aria-selected="true" role="tab" href="auth.html">Log in</a><a class="tab-btn auth-tab" aria-selected="false" role="tab" href="auth.html#register">Create account</a></div>
        <div class="stack-xs stack"><h1 class="auth-title">Welcome back</h1><p class="muted">Log in to see your matches, roadmap and contests.</p></div>
        <div class="alert alert-ok" id="login-ok" role="status"><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-check"/></svg><span>Password changed. Log in with your new password.</span></div>
        <div class="alert alert-error" id="login-alert" role="alert" hidden><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-circle-alert"/></svg><span>That email and password don't match. Check them, or reset your password.</span></div>
        <div class="field"><label class="field-label" for="login-email">Email</label><input class="input" id="login-email" type="email" value="aarav.m@gmail.com" placeholder="you@example.com" autocomplete="email" aria-describedby="login-email-error"><p class="form-error" id="login-email-error" hidden><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-circle-alert"/></svg></p></div>
        <div class="field"><label class="field-label" for="login-password">Password</label><div class="password-field"><input class="input" id="login-password" type="password" autocomplete="current-password" aria-describedby="login-password-error"><button class="password-toggle" type="button" aria-label="Show password"><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-eye"/></svg></button></div><p class="form-error" id="login-password-error" hidden><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-circle-alert"/></svg></p></div>
        <div class="auth-row"><a class="small" href="auth.html#forgot">Forgot password?</a></div>
        <button class="btn btn-primary btn-block" id="login-btn" type="submit">Log in</button>
        <p class="small muted auth-switch">New here? <a href="auth.html#register">Create an account</a></p>
      </form>
    </div>
  </template>
</body>
</html>
