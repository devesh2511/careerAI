<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CareerAI · Quiz Complete</title>
  <link rel="stylesheet" href="../style.css" />
</head>

<body data-page="quizcomplete">

  <!-- ════════════════════════════════════════
     QUIZ COMPLETE SCREEN
════════════════════════════════════════ -->
  <div id="quizcomplete" class="screen active">
    <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;">
      <div class="qc-wrap">
        <div class="qc-emoji">🎉</div>
        <h2 style="font-size:28px;font-weight:800;margin-bottom:12px;">Quiz Complete!</h2>
        <p style="font-size:15px;color:var(--muted);margin-bottom:32px;">Great job, Devesh! Your aptitude scores are in.
          We're generating your career matches now.</p>
        <div class="card" style="margin-bottom:24px;">
          <div
            style="font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:16px;">
            Your Aptitude Scores</div>
          <div class="meter">
            <div class="meter-label">Logical Reasoning</div>
            <div class="meter-track">
              <div class="meter-fill" style="width:82%;background:linear-gradient(90deg,var(--accent),#a8a3ff);"></div>
            </div>
            <div class="meter-pct" style="color:#a8a3ff;">82</div>
          </div>
          <div class="meter">
            <div class="meter-label">Spatial Ability</div>
            <div class="meter-track">
              <div class="meter-fill" style="width:91%;background:linear-gradient(90deg,var(--accent2),#6ee7d4);"></div>
            </div>
            <div class="meter-pct" style="color:var(--accent2);">91</div>
          </div>
          <div class="meter">
            <div class="meter-label">Verbal Aptitude</div>
            <div class="meter-track">
              <div class="meter-fill" style="width:68%;background:linear-gradient(90deg,#38bdf8,#7dd3fc);"></div>
            </div>
            <div class="meter-pct" style="color:#38bdf8;">68</div>
          </div>
          <div class="meter">
            <div class="meter-label">Domain Curiosity</div>
            <div class="meter-track">
              <div class="meter-fill" style="width:88%;background:linear-gradient(90deg,#f59e0b,#fcd34d);"></div>
            </div>
            <div class="meter-pct" style="color:#fcd34d;">88</div>
          </div>
        </div>
        <p style="font-size:13px;color:var(--muted);margin-bottom:20px;">Generating your 100+ career matches…</p>
        <button class="btn btn-primary btn-lg" style="width:100%;justify-content:center;" onclick="show('results')">See
          My Career Matches →</button>
      </div>
    </div>
  </div>

  <script src="../riasec_careers.js"></script>
  <script src="../riasec_engine.js"></script>
  <script src="../script.js"></script>

</body>

</html>
