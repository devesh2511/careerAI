<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CareerAI · Sign In</title>
  <!-- Resolve the theme before first paint: a deferred script would let a
       dark-mode user see a white flash on every navigation. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('careerai_theme');
        if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
    })();
  </script>
  <link rel="stylesheet" href="../style.css" />
</head>

<body data-page="auth">

  <!-- ════════════════════════════════════════
     AUTH SCREEN
════════════════════════════════════════ -->
  <div id="auth" class="screen active">
    <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;">
      <div class="auth-box">
        <div class="auth-logo">Career<span>AI</span></div>
        <div class="auth-tagline">Discover the career you were born for</div>
        <div class="auth-tabs">
          <button class="auth-tab active" onclick="authTab('login',this)">Login</button>
          <button class="auth-tab" onclick="authTab('register',this)">Register</button>
        </div>
        <form id="auth-login" novalidate onsubmit="authSubmitLogin(event)">
          <div class="form-alert" id="login-alert" role="alert"></div>
          <div class="form-group">
            <label class="form-label" for="login-email">Email</label>
            <input class="form-input" id="login-email" type="email" autocomplete="email" placeholder="you@email.com" />
          </div>
          <div class="form-group">
            <label class="form-label" for="login-password">Password</label>
            <input class="form-input" id="login-password" type="password" autocomplete="current-password"
              placeholder="••••••••" />
          </div>
          <button class="btn btn-primary" id="login-btn" type="submit" style="width:100%;justify-content:center;">Login
            →</button>
          <!-- Google login comes later (careerAPI docs/database-schema.md §2.2).
          <div class="auth-divider">or</div>
          <button class="google-btn" onclick="show('dashboard')">🌐 Continue with Google</button> -->
          <p style="text-align:center;font-size:12px;color:var(--muted);margin-top:16px;cursor:pointer;"
            onclick="authTab('register', document.querySelectorAll('.auth-tab')[1])">New here? Create an account</p>
        </form>
        <form id="auth-register" novalidate style="display:none;" onsubmit="authSubmitRegister(event)">
          <div class="form-alert" id="reg-alert" role="alert"></div>
          <div class="form-group">
            <label class="form-label" for="reg-full_name">Full Name</label>
            <input class="form-input" id="reg-full_name" autocomplete="name" maxlength="80" placeholder="Devesh Jain" />
            <div class="form-hint">Leaderboards show your first name and last initial, e.g. Devesh J.</div>
            <div class="form-error" id="reg-full_name-error"></div>
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-school_code">School ID <span
                style="font-weight:400;color:var(--muted);">(optional)</span></label>
            <input class="form-input" id="reg-school_code" maxlength="20" placeholder="e.g. DPS-RKP"
              autocapitalize="characters" style="text-transform:uppercase;" />
            <div class="form-hint">Your school gives you this. Leave it blank if your school isn't on CareerAI.</div>
            <div class="form-error" id="reg-school_code-error"></div>
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-email">Email</label>
            <input class="form-input" id="reg-email" type="email" autocomplete="email" placeholder="you@email.com" />
            <div class="form-hint">Got a School ID? Use the email your school has on its list.</div>
            <div class="form-error" id="reg-email-error"></div>
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-password">Password</label>
            <input class="form-input" id="reg-password" type="password" autocomplete="new-password"
              placeholder="Min 8 characters" />
            <div class="form-error" id="reg-password-error"></div>
          </div>
          <button class="btn btn-primary" id="reg-btn" type="submit" style="width:100%;justify-content:center;">Create
            Account →</button>
          <!-- Google sign-up comes later (careerAPI docs/database-schema.md §2.2).
          <div class="auth-divider">or</div>
          <button class="google-btn" onclick="show('onboarding')">🌐 Sign up with Google</button> -->
        </form>
        <p style="text-align:center;font-size:12px;color:var(--muted);margin-top:20px;cursor:pointer;"
          onclick="show('landing')">← Back to home</p>
      </div>
    </div>
  </div>

  <script src="../scripts/riasec_careers.js"></script>
  <script src="../scripts/riasec_engine.js"></script>
  <script src="../scripts/careerapi_mock.js"></script>
  <script src="../scripts/script.js"></script>

</body>

</html>
