<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CareerAI · Sign In</title>
  <!-- Resolve the theme before first paint: a deferred script would let a
       dark-mode user see a white flash on every navigation. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('careerai_theme');
        if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
    })();
  </script>
  <link rel="stylesheet" href="../style.css" />
</head>

<body data-page="auth">

  <!-- ════════════════════════════════════════
     AUTH SCREEN
════════════════════════════════════════ -->
  <div id="auth" class="screen active">
    <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;">
      <div class="auth-box">
        <div class="auth-logo">Career<span>AI</span></div>
        <div class="auth-tagline">Discover the career you were born for</div>
        <div class="auth-tabs">
          <button class="auth-tab active" onclick="authTab('login',this)">Login</button>
          <button class="auth-tab" onclick="authTab('register',this)">Register</button>
        </div>
        <div id="auth-login">
          <div class="form-group">
            <label class="form-label">Email</label>
            <input class="form-input" type="email" placeholder="you@email.com" />
          </div>
          <div class="form-group">
            <label class="form-label">Password</label>
            <input class="form-input" type="password" placeholder="••••••••" />
          </div>
          <button class="btn btn-primary" style="width:100%;justify-content:center;" onclick="show('dashboard')">Login
            →</button>
          <div class="auth-divider">or</div>
          <button class="google-btn" onclick="show('dashboard')">🌐 Continue with Google</button>
          <p style="text-align:center;font-size:12px;color:var(--muted);margin-top:16px;cursor:pointer;"
            onclick="show('onboarding')">New here? Create a free account</p>
        </div>
        <div id="auth-register" style="display:none;">
          <div class="form-group">
            <label class="form-label">Full Name</label>
            <input class="form-input" placeholder="Devesh Jain" />
          </div>
          <div class="form-group">
            <label class="form-label">Email</label>
            <input class="form-input" type="email" placeholder="you@email.com" />
          </div>
          <div class="form-group">
            <label class="form-label">Password</label>
            <input class="form-input" type="password" placeholder="Min 8 characters" />
          </div>
          <button class="btn btn-primary" style="width:100%;justify-content:center;" onclick="show('onboarding')">Create
            Account →</button>
          <div class="auth-divider">or</div>
          <button class="google-btn" onclick="show('onboarding')">🌐 Sign up with Google</button>
        </div>
        <p style="text-align:center;font-size:12px;color:var(--muted);margin-top:20px;cursor:pointer;"
          onclick="show('landing')">← Back to home</p>
      </div>
    </div>
  </div>

  <script src="../scripts/riasec_careers.js"></script>
  <script src="../scripts/riasec_engine.js"></script>
  <script src="../scripts/script.js"></script>

</body>

</html>
