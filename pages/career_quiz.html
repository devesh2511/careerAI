<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Crackeer · Career quiz</title>
  <!-- No icon file yet; an empty one stops the /favicon.ico request (a 404). -->
  <link rel="icon" href="data:," />
  <!-- Resolve the theme before first paint: a deferred script would let a
       dark-mode user see a white flash on every navigation. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('careerai_theme');
        if (t !== 'dark') t = 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
    })();
  </script>
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/layouts.css" />
</head>

<body data-page="careerquiz">
  <div class="flow" id="careerquiz">
    <header class="flow-bar">
      <button class="btn btn-icon" id="cq-back-btn" type="button" onclick="cqPrev()" aria-label="Previous question" disabled><svg class="icon" aria-hidden="true"><use href="/assets/icons/sprite.svg#i-arrow-left"/></svg></button>
      <p class="flow-title" id="cq-num">Question 1 of 25</p>
      <button class="theme-toggle btn btn-icon" type="button" onclick="toggleTheme()" aria-label="Dark theme" aria-pressed="false"><span class="theme-icon-light"><svg class="icon" aria-hidden="true"><use href="/assets/icons/sprite.svg#i-moon"/></svg></span><span class="theme-icon-dark"><svg class="icon" aria-hidden="true"><use href="/assets/icons/sprite.svg#i-sun"/></svg></span></button>
      <progress class="progress" id="cq-bar" max="25" value="0">Progress</progress>
    </header>
    <main class="flow-main">
      <div class="stack" id="cq-question-wrap">
        <span class="badge badge-outline" id="cq-area"></span>
        <h1 class="question-text" id="cq-q"></h1>
        <p class="cq-hint field-hint" id="cq-hint" aria-live="polite"></p>
        <div class="option-list" id="cq-opts" role="group" aria-labelledby="cq-q"></div>
      </div>
    </main>
    <footer class="flow-foot"><div class="flow-foot-inner">
      <span class="small muted">Answers save as you go.</span>
      <button class="btn btn-primary" id="cq-next-btn" type="button" onclick="cqNextQ()">Next<svg class="icon" aria-hidden="true"><use href="/assets/icons/sprite.svg#i-arrow-right"/></svg></button>
    </div></footer>
  </div>

  <script src="../scripts/riasec_engine.js"></script>
  <script src="../scripts/careerapi_mock.js"></script>
  <script src="../scripts/script.js"></script>

</body>

</html>
