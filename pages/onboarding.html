<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Crackeer · Tell us about you</title>
  <link rel="icon" href="/assets/brand/favicon-16.png" sizes="16x16" type="image/png" />
  <link rel="icon" href="/assets/brand/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="/assets/brand/favicon.ico" sizes="48x48" />
  <link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png" />
  <link rel="manifest" href="/assets/brand/site.webmanifest" />
  <!-- Resolve the theme before first paint: a deferred script would let a
       dark-mode user see a white flash on every navigation. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('careerai_theme');
        if (t !== 'dark') t = 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
    })();
  </script>
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/layouts.css" />
</head>

<body data-page="onboarding">
  <div class="flow">
    <header class="flow-bar">
      <span aria-hidden="true"></span>
      <p class="flow-title" id="ob-count">Step 1 of 4</p>
      <button class="theme-toggle btn btn-icon" type="button" onclick="toggleTheme()" aria-label="Dark theme" aria-pressed="false"><span class="theme-icon-light"><svg class="icon" aria-hidden="true"><use href="/assets/icons/sprite.svg#i-moon"/></svg></span><span class="theme-icon-dark"><svg class="icon" aria-hidden="true"><use href="/assets/icons/sprite.svg#i-sun"/></svg></span></button>
      <progress class="progress" id="ob-bar" max="4" value="1">Step 1 of 4</progress>
    </header>
    <main class="flow-main" id="onboarding">
      <ol class="ob-steps" id="ob-dots" aria-label="Steps"><li class="dot active" aria-current="step"><span class="dot-mark">1</span><span class="dot-label">About you</span></li><li class="dot"><span class="dot-mark">2</span><span class="dot-label">Marks</span></li><li class="dot"><span class="dot-mark">3</span><span class="dot-label">Interests</span></li><li class="dot"><span class="dot-mark">4</span><span class="dot-label">Preferences</span></li></ol>
      <div class="stack-sm stack"><h1 id="ob-title">About you</h1><p class="muted" id="ob-sub">So we can match careers to your board, medium and city.</p></div>
      <div class="alert alert-error form-alert" id="ob-error" role="alert"></div>
      <section class="stack-lg stack" id="ob-step-1">
        <div class="grid-2">
          <div class="field"><label class="field-label" for="ob-class">Current class</label><div class="select-wrap"><select class="select" id="ob-class"><option value="9">Class 9</option><option value="10" selected>Class 10</option></select><svg class="icon" aria-hidden="true"><use href="/assets/icons/sprite.svg#i-chevron-down"/></svg></div></div>
          <div class="field"><label class="field-label" for="ob-board">School board</label><div class="select-wrap"><select class="select" id="ob-board"><option selected>CBSE</option><option>ICSE</option><option>State Board</option></select><svg class="icon" aria-hidden="true"><use href="/assets/icons/sprite.svg#i-chevron-down"/></svg></div></div>
          <div class="field"><label class="field-label" for="ob-medium">Medium of instruction</label><div class="select-wrap"><select class="select" id="ob-medium"><option selected>English</option><option>Hindi</option><option>Regional Language</option></select><svg class="icon" aria-hidden="true"><use href="/assets/icons/sprite.svg#i-chevron-down"/></svg></div></div>
          <div class="field"><label class="field-label" for="ob-city">City</label><input class="input" id="ob-city" maxlength="80" autocomplete="address-level2" placeholder="e.g. Mumbai, Delhi, Bengaluru" /></div>
        </div>
      </section>
      <section class="stack-lg stack" id="ob-step-2" hidden>
        <div class="grid-2 marks-grid"><div class="field mark-field"><label class="field-label" for="ob-mark-mathematics">Mathematics</label><div class="mark-input"><input class="input" id="ob-mark-mathematics" data-subject="Mathematics" type="number" min="0" max="100" inputmode="numeric" placeholder="e.g. 80"><span class="muted">%</span></div></div><div class="field mark-field"><label class="field-label" for="ob-mark-science">Science</label><div class="mark-input"><input class="input" id="ob-mark-science" data-subject="Science" type="number" min="0" max="100" inputmode="numeric" placeholder="e.g. 80"><span class="muted">%</span></div></div><div class="field mark-field"><label class="field-label" for="ob-mark-english">English</label><div class="mark-input"><input class="input" id="ob-mark-english" data-subject="English" type="number" min="0" max="100" inputmode="numeric" placeholder="e.g. 80"><span class="muted">%</span></div></div><div class="field mark-field"><label class="field-label" for="ob-mark-social-studies">Social Studies</label><div class="mark-input"><input class="input" id="ob-mark-social-studies" data-subject="Social Studies" type="number" min="0" max="100" inputmode="numeric" placeholder="e.g. 80"><span class="muted">%</span></div></div></div>
      </section>
      <section class="stack-lg stack" id="ob-step-3" hidden>
        <div class="field"><span class="field-label" id="ob-subjects-label">Favourite subjects</span><p class="field-hint">Pick all you like.</p><div class="chip-group chip-grid" id="ob-subjects" role="group" aria-labelledby="ob-subjects-label"><button class="chip" type="button" onclick="this.classList.toggle('selected')">Mathematics</button><button class="chip" type="button" onclick="this.classList.toggle('selected')">Science</button><button class="chip" type="button" onclick="this.classList.toggle('selected')">Computer</button><button class="chip" type="button" onclick="this.classList.toggle('selected')">English</button><button class="chip" type="button" onclick="this.classList.toggle('selected')">Art &amp; Design</button><button class="chip" type="button" onclick="this.classList.toggle('selected')">Social Studies</button><button class="chip" type="button" onclick="this.classList.toggle('selected')">Economics</button><button class="chip" type="button" onclick="this.classList.toggle('selected')">Music</button></div></div>
        <div class="field"><span class="field-label" id="ob-hobbies-label">Hobbies and interests</span><div class="chip-group chip-grid" id="ob-hobbies" role="group" aria-labelledby="ob-hobbies-label"><button class="chip" type="button" onclick="this.classList.toggle('selected')">Drawing / Design</button><button class="chip" type="button" onclick="this.classList.toggle('selected')">Coding</button><button class="chip" type="button" onclick="this.classList.toggle('selected')">Sports</button><button class="chip" type="button" onclick="this.classList.toggle('selected')">Music</button><button class="chip" type="button" onclick="this.classList.toggle('selected')">Reading</button><button class="chip" type="button" onclick="this.classList.toggle('selected')">Gaming</button><button class="chip" type="button" onclick="this.classList.toggle('selected')">Debating</button><button class="chip" type="button" onclick="this.classList.toggle('selected')">Cooking</button></div></div>
        <div class="field"><label class="field-label" for="ob-dream">Dream job or role model <span class="optional">(optional)</span></label><input class="input" id="ob-dream" maxlength="80" placeholder="e.g. I want to design apps like Instagram" /></div>
      </section>
      <section class="stack-lg stack" id="ob-step-4" hidden>
        <div class="field"><span class="field-label" id="ob-pref-label">Where would you like to work?</span><div class="chip-group chip-grid" id="ob-pref" role="group" aria-labelledby="ob-pref-label"><button class="chip selected" type="button" onclick="chipOne(this,'pref')">Private Sector</button><button class="chip" type="button" onclick="chipOne(this,'pref')">Government Job</button><button class="chip" type="button" onclick="chipOne(this,'pref')">Entrepreneur</button></div></div>
        <div class="field"><span class="field-label" id="ob-loc-label">Open to studying outside your city?</span><div class="chip-group chip-grid" id="ob-loc" role="group" aria-labelledby="ob-loc-label"><button class="chip selected" type="button" onclick="chipOne(this,'loc')">Yes, anywhere</button><button class="chip" type="button" onclick="chipOne(this,'loc')">Same state only</button><button class="chip" type="button" onclick="chipOne(this,'loc')">Prefer home city</button></div></div>
      </section>
    </main>
    <footer class="flow-foot"><div class="flow-foot-inner">
      <button class="btn btn-secondary" id="ob-back" type="button" onclick="obStep(-1)" disabled><svg class="icon" aria-hidden="true"><use href="/assets/icons/sprite.svg#i-arrow-left"/></svg>Back</button>
      <button class="btn btn-primary" id="ob-next" type="button">Next<svg class="icon" aria-hidden="true"><use href="/assets/icons/sprite.svg#i-arrow-right"/></svg></button>
    </div></footer>
  </div>

  <script src="../scripts/riasec_engine.js"></script>
  <script src="../scripts/careerapi_mock.js"></script>
  <script src="../scripts/script.js"></script>

</body>

</html>
