<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CareerAI · Unlock</title>
  <!-- Resolve the theme before first paint: a deferred script would let a
       dark-mode user see a white flash on every navigation. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('careerai_theme');
        if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
    })();
  </script>
  <link rel="stylesheet" href="../style.css" />
</head>

<body data-page="paywall">

  <!-- ════════════════════════════════════════
     PAYWALL
     Where every paid page sends a student without access. Everything
     inside #pw-root is drawn by pw* functions in scripts/script.js: why
     they aren't covered, a School ID box, the plans and how to pay
     (outside the website; an admin records the payment ID).
     ?next=onboarding sends a brand-new student to onboarding once they have access.
════════════════════════════════════════ -->
  <div id="paywall" class="screen active">
    <div class="pw-page">
      <div class="pw-top">
        <div class="auth-logo" style="margin:0;">Career<span>AI</span></div>
        <div class="pw-top-actions">
          <button class="theme-toggle" onclick="toggleTheme()" aria-label="Switch theme" aria-pressed="false">
            <span class="ti ti-moon" aria-hidden="true">&#127769;</span>
            <span class="ti ti-sun" aria-hidden="true">&#9728;&#65039;</span>
          </button>
          <button class="btn btn-ghost btn-sm" onclick="logout()">Log out</button>
        </div>
      </div>
      <div class="pw-wrap" id="pw-root" aria-live="polite"></div>
    </div>
  </div>

  <script src="../scripts/riasec_careers.js"></script>
  <script src="../scripts/riasec_engine.js"></script>
  <script src="../scripts/careerapi_mock.js"></script>
  <script src="../scripts/script.js"></script>

</body>

</html>
