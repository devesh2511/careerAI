<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Crackeer · Your profile</title>
  <!-- No icon file yet; an empty one stops the /favicon.ico request (a 404). -->
  <link rel="icon" href="data:," />
  <!-- Resolve the theme before first paint: a deferred script would let a
       dark-mode user see a white flash on every navigation. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('careerai_theme');
        if (t !== 'dark') t = 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
    })();
  </script>
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/layouts.css" />
</head>

<body data-page="evaluation">
  <div class="flow">
    <header class="flow-bar">
      <a class="btn btn-icon" href="onboarding.html#/step/4" aria-label="Back to onboarding"><svg class="icon" aria-hidden="true"><use href="/assets/icons/sprite.svg#i-arrow-left"/></svg></a>
      <p class="flow-title">Before the quiz</p>
      <button class="theme-toggle btn btn-icon" type="button" onclick="toggleTheme()" aria-label="Dark theme" aria-pressed="false"><span class="theme-icon-light"><svg class="icon" aria-hidden="true"><use href="/assets/icons/sprite.svg#i-moon"/></svg></span><span class="theme-icon-dark"><svg class="icon" aria-hidden="true"><use href="/assets/icons/sprite.svg#i-sun"/></svg></span></button>
    </header>
    <main class="flow-main">
      <div class="stack-sm stack"><h1 id="eval-title">Here's what you told us</h1><p class="muted" id="eval-sub">Check it looks right, then start the quiz. Your answers here and in the quiz decide your matches.</p></div>
      <section class="card stack-lg stack" aria-labelledby="ev-card-title">
        <div class="section-head"><h2 class="card-title" id="ev-card-title">Your profile at a glance</h2><a class="btn btn-ghost btn-sm" href="onboarding.html"><svg class="icon" aria-hidden="true"><use href="/assets/icons/sprite.svg#i-pencil"/></svg>Edit</a></div>
        <div class="stack-lg stack" id="eval-body" aria-live="polite">
          <div class="skeleton-card" aria-hidden="true"><div class="skeleton skeleton-line w-80"></div><div class="skeleton skeleton-line w-60"></div><div class="skeleton skeleton-line w-40"></div></div>
        </div>
      </section>
      <section class="card-ink quiz-start" aria-labelledby="ev-start-title">
        <div class="illo"><img src="/assets/illustrations/rocket-200.webp" alt=""></div>
        <div class="stack-sm stack"><h2 class="card-title-lg" id="ev-start-title">Ready for the quiz?</h2><p class="muted">25 questions, about 6 minutes. Pick what sounds like you, not what sounds impressive.</p></div>
        <button class="btn btn-primary" type="button" onclick="cqStart()">Start the career quiz</button>
      </section>
    </main>
  </div>

  <script src="../scripts/riasec_engine.js"></script>
  <script src="../scripts/careerapi_mock.js"></script>
  <script src="../scripts/script.js"></script>

</body>

</html>
