<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Crackeer · Weekly contest</title>
  <meta name="description" content="A 25-question quiz, honest career matches and a step-by-step roadmap from Class 9 to your first job. Built for school students in India." />
  <!-- Link previews (WhatsApp, LinkedIn, X). Crawlers need absolute URLs, so these point at production. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Crackeer" />
  <meta property="og:title" content="Crackeer · Weekly contest" />
  <meta property="og:description" content="A 25-question quiz, honest career matches and a step-by-step roadmap from Class 9 to your first job. Built for school students in India." />
  <meta property="og:image" content="https://career-ai-six-plum.vercel.app/assets/brand/og-image.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Crackeer: Find the career that fits how you think." />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="/assets/brand/favicon-16.png" sizes="16x16" type="image/png" />
  <link rel="icon" href="/assets/brand/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="/assets/brand/favicon.ico" sizes="48x48" />
  <link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png" />
  <link rel="manifest" href="/assets/brand/site.webmanifest" />
  <!-- Resolve the theme before first paint: a deferred script would let a
       dark-mode user see a white flash on every navigation. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('careerai_theme');
        if (t !== 'dark') t = 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
    })();
  </script>
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/layouts.css" />
</head>

<body data-page="quiz">
  <div class="flow" id="quiz">
    <header class="flow-bar">
      <button class="btn btn-icon" type="button" onclick="goBack('contests')" aria-label="Back to contests"><svg class="icon" aria-hidden="true"><use href="/assets/icons/sprite.svg#i-x"/></svg></button>
      <p class="flow-title" id="ct-label">Weekly contest</p>
      <button class="theme-toggle btn btn-icon" type="button" onclick="toggleTheme()" aria-label="Dark theme" aria-pressed="false"><span class="theme-icon-light"><svg class="icon" aria-hidden="true"><use href="/assets/icons/sprite.svg#i-moon"/></svg></span><span class="theme-icon-dark"><svg class="icon" aria-hidden="true"><use href="/assets/icons/sprite.svg#i-sun"/></svg></span></button>
    </header>
    <main class="flow-main stack-lg stack" id="ct-root" aria-live="polite"></main>
  </div>

  <script src="../scripts/riasec_engine.js"></script>
  <script src="../scripts/contest_api.js"></script>
  <script src="../scripts/contest.js"></script>
  <script src="../scripts/careerapi_mock.js"></script>
  <script src="../scripts/script.js"></script>

</body>

</html>
