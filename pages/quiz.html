<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Crackeer · Weekly contest</title>
  <!-- No icon file yet; an empty one stops the /favicon.ico request (a 404). -->
  <link rel="icon" href="data:," />
  <!-- Resolve the theme before first paint: a deferred script would let a
       dark-mode user see a white flash on every navigation. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('careerai_theme');
        if (t !== 'dark') t = 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
    })();
  </script>
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/layouts.css" />
</head>

<body data-page="quiz">
  <div class="flow" id="quiz">
    <header class="flow-bar">
      <button class="btn btn-icon" type="button" onclick="goBack('contests')" aria-label="Back to contests"><svg class="icon" aria-hidden="true"><use href="/assets/icons/sprite.svg#i-x"/></svg></button>
      <p class="flow-title" id="ct-label">Weekly contest</p>
      <button class="theme-toggle btn btn-icon" type="button" onclick="toggleTheme()" aria-label="Dark theme" aria-pressed="false"><span class="theme-icon-light"><svg class="icon" aria-hidden="true"><use href="/assets/icons/sprite.svg#i-moon"/></svg></span><span class="theme-icon-dark"><svg class="icon" aria-hidden="true"><use href="/assets/icons/sprite.svg#i-sun"/></svg></span></button>
    </header>
    <main class="flow-main stack-lg stack" id="ct-root" aria-live="polite"></main>
  </div>

  <script src="../scripts/riasec_engine.js"></script>
  <script src="../scripts/contest_api.js"></script>
  <script src="../scripts/contest.js"></script>
  <script src="../scripts/careerapi_mock.js"></script>
  <script src="../scripts/script.js"></script>

</body>

</html>
