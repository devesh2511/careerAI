<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CareerAI · Weekly Aptitude Contest</title>
  <!-- Resolve the theme before first paint: a deferred script would let a
       dark-mode user see a white flash on every navigation. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('careerai_theme');
        if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
    })();
  </script>
  <link rel="stylesheet" href="../style.css" />
</head>

<body data-page="quiz">

  <!-- ════════════════════════════════════════
     WEEKLY APTITUDE CONTEST
     Everything inside #ct-root is drawn by scripts/contest.js: the lobby,
     the 5 questions, the submit review, the "results at 7 PM" wait and
     ?review=N for a closed contest's answers.
════════════════════════════════════════ -->
  <div id="quiz" class="screen active">
    <div class="ct-page">
      <div class="quiz-wrap">
        <div class="quiz-topbar">
          <button class="btn btn-ghost btn-sm" onclick="show('contests')" aria-label="Back to contests">←</button>
          <span class="quiz-num" id="ct-label">Weekly Aptitude Contest</span>
          <button class="theme-toggle" onclick="toggleTheme()" aria-label="Switch theme" aria-pressed="false">
            <span class="ti ti-moon" aria-hidden="true">&#127769;</span>
            <span class="ti ti-sun" aria-hidden="true">&#9728;&#65039;</span>
          </button>
        </div>
        <div id="ct-root" aria-live="polite"></div>
      </div>
    </div>
  </div>

  <script src="../scripts/riasec_careers.js"></script>
  <script src="../scripts/riasec_engine.js"></script>
  <script src="../scripts/contest_api.js"></script>
  <script src="../scripts/contest.js"></script>
  <script src="../scripts/careerapi_mock.js"></script>
  <script src="../scripts/script.js"></script>

</body>

</html>
