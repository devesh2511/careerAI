<!doctype html>
<!-- Audit self-test: every block below plants one defect the audit must report. -->
<html lang="en"><head><meta charset="utf-8"><title>audit fixture</title>
<style>
  body { margin: 0; font: 16px sans-serif; background: #fff; color: #111; }
  .wide { width: 2000px; height: 10px; }
  .pair { position: relative; height: 40px; }
  .pair span { position: absolute; top: 0; left: 0; }
  .chip { display: inline-block; width: 60px; white-space: nowrap; border: 1px solid #000; }
  .clipbox { height: 20px; overflow: hidden; }
  .faint { color: #ddd; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; height: 120px; background: #eee; }
</style></head>
<body><main data-proto-root>
  <div class="wide"></div>
  <div class="pair"><span>First label text</span><span>Second label text</span></div>
  <div class="pair"><svg aria-hidden="true" width="24" height="24" style="position:absolute;top:0;left:0"><rect width="24" height="24"/></svg><span>Icon under text</span></div>
  <p><span class="chip">A very long chip label</span></p>
  <div class="clipbox"><p>line one</p><p>line two</p><p>line three</p></div>
  <p class="faint">Barely visible text</p>
  <div style="height: 700px">Filler</div>
  <p>The last line sits under the fixed bar.</p>
</main>
<div class="bar">Fixed bottom bar</div>
</body></html>
